<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gemini 4 Carbon | Launch</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh;object-fit:contain}
</style>
</head>
<body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const c=document.getElementById('c'),x=c.getContext('2d');
const W=1920,H=1080,DUR=15;
const F='"Google Sans","Product Sans","Helvetica Neue",Helvetica,Arial,sans-serif';
const MONO='"SF Mono",Menlo,Consolas,"Roboto Mono",monospace';
const CB='#4285F4',CR='#EA4335',CY='#FBBC04',CG='#34A853',CP='#9B72CB',CK='#D96570';
const cl=v=>v<0?0:v>1?1:v,sg=(t,a,b)=>cl((t-a)/(b-a)),eo=p=>1-Math.pow(1-p,3),
eio=p=>p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2,mod=(a,n)=>((a%n)+n)%n,
ebk=p=>1+2.70158*Math.pow(p-1,3)+1.70158*Math.pow(p-1,2);
const win=(t,a,b,f=.4)=>Math.min(sg(t,a,a+f),1-sg(t,b-f,b));
let _s=20261110;const rnd=()=>{_s|=0;_s=_s+0x6D2B79F5|0;let q=Math.imul(_s^_s>>>15,1|_s);q=q+Math.imul(q^q>>>7,61|q)^q;return((q^q>>>14)>>>0)/4294967296;};
const PALS=[CB,CR,CY,CG,CP,'#8ab4f8','#c58af9'];

/* ---------- textures ---------- */
const pc=document.createElement('canvas');pc.width=pc.height=20;
{const p=pc.getContext('2d');p.fillStyle='#07080b';p.fillRect(0,0,20,20);
const cell=(X,Yy,h)=>{const g=h?p.createLinearGradient(X,Yy,X+10,Yy):p.createLinearGradient(X,Yy,X,Yy+10);
g.addColorStop(0,'#0c0e12');g.addColorStop(.5,'#232830');g.addColorStop(1,'#0c0e12');p.fillStyle=g;p.fillRect(X+.5,Yy+.5,9,9);};
cell(0,0,1);cell(10,10,1);cell(10,0,0);cell(0,10,0);}
const pat=x.createPattern(pc,'repeat');
const NZ=document.createElement('canvas');NZ.width=NZ.height=256;
{const k=NZ.getContext('2d'),d=k.createImageData(256,256);for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255;}k.putImageData(d,0,0);}
const NP=x.createPattern(NZ,'repeat');
const VIG=(()=>{const g=x.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*1.05);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.7)');return g;})();

/* ---------- title (pre-rendered with glow + RGB split layers) ---------- */
const TF=`700 170px ${F}`,TC=document.createElement('canvas'),TR=document.createElement('canvas'),TCY=document.createElement('canvas'),TG=document.createElement('canvas');
{const m=document.createElement('canvas').getContext('2d');m.font=TF;const w1=m.measureText('Gemini 4 ').width,w2=m.measureText('Carbon').width;
const PX=110,w=Math.ceil(w1+w2+PX*2),h=320,by=210;for(const cv of[TC,TR,TCY,TG]){cv.width=w;cv.height=h;}
const paint=k=>{k.font=TF;k.textBaseline='alphabetic';const g=k.createLinearGradient(PX,0,PX+w1,0);g.addColorStop(0,CB);g.addColorStop(.55,CP);g.addColorStop(1,CK);
k.fillStyle=g;k.fillText('Gemini 4 ',PX,by);const g2=k.createLinearGradient(0,by-125,0,by+5);
g2.addColorStop(0,'#ffffff');g2.addColorStop(.42,'#cfd4db');g2.addColorStop(.55,'#59626d');g2.addColorStop(.78,'#e2e6eb');g2.addColorStop(1,'#ffffff');
k.fillStyle=g2;k.fillText('Carbon',PX+w1,by);};
paint(TC.getContext('2d'));
for(const[cv,col]of[[TR,'#ff2d55'],[TCY,'#00e5ff']]){const k=cv.getContext('2d');paint(k);k.globalCompositeOperation='source-in';k.fillStyle=col;k.fillRect(0,0,w,h);}
const g=TG.getContext('2d');g.font=TF;g.shadowColor='rgba(110,140,255,1)';g.shadowBlur=70;g.shadowOffsetX=10000;g.fillStyle='#fff';g.fillText('Gemini 4 Carbon',PX-10000,by);}
const SH=document.createElement('canvas');SH.width=TC.width;SH.height=TC.height;const shx=SH.getContext('2d');

/* ---------- "/swarm" text -> particles ---------- */
const SW=document.createElement('canvas');
{const m=SW.getContext('2d');m.font=`700 230px ${MONO}`;SW.width=Math.ceil(m.measureText('/swarm').width)+80;SW.height=300;
const k=SW.getContext('2d');k.font=`700 230px ${MONO}`;k.textBaseline='middle';const g=k.createLinearGradient(40,0,SW.width-40,0);
g.addColorStop(0,'#8ab4f8');g.addColorStop(.5,'#c58af9');g.addColorStop(1,'#f28b82');k.fillStyle=g;k.fillText('/swarm',40,150);}

/* ---------- helpers ---------- */
function rr(X,Yy,w,h,r){r=Math.max(0,r);x.beginPath();x.moveTo(X+r,Yy);x.arcTo(X+w,Yy,X+w,Yy+h,r);x.arcTo(X+w,Yy+h,X,Yy+h,r);x.arcTo(X,Yy+h,X,Yy,r);x.arcTo(X,Yy,X+w,Yy,r);x.closePath();}
function el(X,Yy,rx,ry,col){x.fillStyle=col;x.beginPath();x.ellipse(X,Yy,rx,ry,0,0,Math.PI*2);x.fill();}
function ln(a,b,col,w){x.strokeStyle=col;x.lineWidth=w;x.beginPath();x.moveTo(a[0],a[1]);x.lineTo(b[0],b[1]);x.stroke();}
function glow(X,Yy,r,col){if(r<=1)return;const g=x.createRadialGradient(X,Yy,0,X,Yy,r);g.addColorStop(0,col);g.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=g;x.fillRect(X-r,Yy-r,2*r,2*r);}
function txt(s,X,Yy,size,o={}){const{w=400,col='#fff',al='center',a=1,ls=0,f=F,mw,sh}=o;if(a<=0)return;
x.save();x.globalAlpha*=a;x.font=`${w} ${size}px ${f}`;x.textAlign=al;x.textBaseline='alphabetic';x.fillStyle=col;
if(ls)x.letterSpacing=ls+'px';if(sh){x.shadowColor='rgba(0,0,0,.6)';x.shadowBlur=26;}mw?x.fillText(s,X,Yy,mw):x.fillText(s,X,Yy);x.restore();}
function gradFor(x0,tw){const g=x.createLinearGradient(x0,0,x0+tw,0);g.addColorStop(0,CB);g.addColorStop(.55,CP);g.addColorStop(1,CK);return g;}
function slam(s,X,Yy,size,w,fill,p,al='left',gl){if(p<=0)return;const e=eo(p);x.save();x.globalAlpha*=cl(p*3);x.translate(X,Yy);const k=1+.6*(1-e);x.scale(k,k);
x.font=`${w} ${size}px ${F}`;x.textAlign=al;let f=fill;if(fill==='grad'){const tw=x.measureText(s).width;f=gradFor(al==='left'?0:al==='center'?-tw/2:-tw,tw);}
x.fillStyle=f;if(gl){x.shadowColor=gl;x.shadowBlur=60;}x.fillText(s,0,0);x.restore();}
function segs(arr,cx,Yy,size,a){if(a<=0)return;x.save();x.globalAlpha*=a;x.textAlign='left';
const ws=arr.map(s=>{x.font=`${s[2]||400} ${size}px ${s[3]||F}`;return x.measureText(s[0]).width;});
let X=cx-ws.reduce((p,q)=>p+q,0)/2;arr.forEach((s,i)=>{x.font=`${s[2]||400} ${size}px ${s[3]||F}`;x.fillStyle=s[1];x.fillText(s[0],X,Yy);X+=ws[i];});x.restore();}
function words(t,ws,cx,Yy,size,t0,dt,hi){x.save();x.font=`600 ${size}px ${F}`;x.textAlign='center';const sp=x.measureText(' ').width,wd=ws.map(w=>x.measureText(w).width);
let X=cx-(wd.reduce((a,b)=>a+b,0)+sp*(ws.length-1))/2;const ga=x.globalAlpha;
ws.forEach((w,i)=>{const p=sg(t,t0+i*dt,t0+i*dt+.35);if(p>0){const e=ebk(p);x.save();x.globalAlpha=ga*cl(p*3);x.translate(X+wd[i]/2,Yy+(1-e)*30);x.scale(.6+.4*e,.6+.4*e);
x.fillStyle=i===hi?gradFor(-wd[i]/2,wd[i]):'#ffffff';x.fillText(w,0,0);x.restore();}X+=wd[i]+sp;});x.restore();}
function sparkle(X,Yy,r,rot,a=1){if(r<=.5)return;x.save();x.globalAlpha*=a;x.translate(X,Yy);x.rotate(rot);const k=r*.16;
x.beginPath();x.moveTo(0,-r);x.quadraticCurveTo(k,-k,r,0);x.quadraticCurveTo(k,k,0,r);x.quadraticCurveTo(-k,k,-r,0);x.quadraticCurveTo(-k,-k,0,-r);
const g=x.createLinearGradient(-r,-r,r,r);g.addColorStop(0,CB);g.addColorStop(.5,CP);g.addColorStop(1,CK);x.fillStyle=g;x.fill();
const g2=x.createRadialGradient(0,0,0,0,0,r*.6);g2.addColorStop(0,'rgba(255,255,255,.55)');g2.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g2;x.fill();x.restore();}
function rays(cx,cy,R,a,rot){if(R<=1||a<=0)return;x.save();x.globalAlpha*=a;const g=x.createRadialGradient(cx,cy,0,cx,cy,R);
g.addColorStop(0,'rgba(160,180,255,.6)');g.addColorStop(1,'rgba(160,180,255,0)');x.fillStyle=g;
for(let i=0;i<14;i++){const an=rot+i*Math.PI*2/14,w=.03+.025*(i%3);x.beginPath();x.moveTo(cx,cy);x.lineTo(cx+Math.cos(an-w)*R,cy+Math.sin(an-w)*R);x.lineTo(cx+Math.cos(an+w)*R,cy+Math.sin(an+w)*R);x.closePath();x.fill();}x.restore();}
function drawTitle(cx,cy,sc,a,split,shine){if(a<=0||sc<=0)return;const w=TC.width,h=TC.height,ox=w/2,oy=149;
x.save();x.translate(cx,cy);x.scale(sc,sc);const ga=x.globalAlpha;
x.globalCompositeOperation='lighter';x.globalAlpha=ga*a*.55;x.drawImage(TG,-ox,-oy);
if(split>.5){x.globalAlpha=ga*a*.85;x.drawImage(TR,-ox-split,-oy);x.drawImage(TCY,-ox+split,-oy);}
x.globalCompositeOperation='source-over';x.globalAlpha=ga*a;let img=TC;
if(shine>=0&&shine<=1){shx.setTransform(1,0,0,1,0,0);shx.globalCompositeOperation='source-over';shx.clearRect(0,0,w,h);shx.drawImage(TC,0,0);
shx.globalCompositeOperation='source-atop';shx.setTransform(1,0,-.35,1,0,0);const sx=-200+(w+500)*shine,g=shx.createLinearGradient(sx-150,0,sx+150,0);
g.addColorStop(0,'rgba(255,255,255,0)');g.addColorStop(.5,'rgba(255,255,255,.95)');g.addColorStop(1,'rgba(255,255,255,0)');shx.fillStyle=g;shx.fillRect(-300,0,w+600,h);
shx.setTransform(1,0,0,1,0,0);img=SH;}
x.drawImage(img,-ox,-oy);x.restore();}

/* ---------- bursts ---------- */
const IMP=Array.from({length:190},()=>({a:rnd()*Math.PI*2,r0:700+rnd()*900,d:rnd()*.35,len:40+rnd()*160,col:PALS[(rnd()*7)|0]}));
const EXP=Array.from({length:280},()=>({a:rnd()*Math.PI*2,sp:250+rnd()*1200,life:.6+rnd()*1.1,col:PALS[(rnd()*7)|0],w:1.5+rnd()*3}));
function ring(cx,cy,p,R,col,ga){if(p<=0||p>=1)return;x.globalAlpha=ga*(1-p);x.strokeStyle=col;x.lineWidth=60*(1-p)+2;x.beginPath();x.arc(cx,cy,R*eo(p),0,7);x.stroke();}
function burst(dt,cx,cy,sc){if(dt<0||dt>1.8)return;const ga=x.globalAlpha;x.save();x.globalCompositeOperation='lighter';x.lineCap='round';
ring(cx,cy,sg(dt,0,.8),1300*sc,'rgba(170,190,255,1)',ga);ring(cx,cy,sg(dt,.08,1.0),1000*sc,'rgba(197,138,249,1)',ga);
for(const o of EXP){const p=dt/o.life;if(p>=1)continue;const d=o.sp*sc*eo(p),len=(80*(1-p)+4)*sc,co=Math.cos(o.a),si=Math.sin(o.a);
x.globalAlpha=ga*(1-p);x.strokeStyle=o.col;x.lineWidth=o.w;x.beginPath();x.moveTo(cx+co*Math.max(0,d-len),cy+si*Math.max(0,d-len));x.lineTo(cx+co*d,cy+si*d);x.stroke();}
x.globalAlpha=ga*(1-sg(dt,0,.5));glow(cx,cy,520*sc,'rgba(255,255,255,1)');x.restore();}

/* ---------- background / post ---------- */
function bg(t){x.fillStyle='#030405';x.fillRect(0,0,W,H);
x.save();x.globalAlpha=.9;x.translate(W/2,H/2);x.rotate(Math.PI/4);x.translate(mod(t*10,20),0);x.fillStyle=pat;x.fillRect(-1500,-1500,3000,3000);x.restore();
const lx=960+380*Math.sin(t*.45),ly=480+160*Math.cos(t*.33),g=x.createRadialGradient(lx,ly,0,lx,ly,1100);
g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(.45,'rgba(0,0,0,.55)');g.addColorStop(1,'rgba(0,0,0,.95)');x.fillStyle=g;x.fillRect(0,0,W,H);
x.save();x.globalCompositeOperation='lighter';glow(lx,ly,750,'rgba(66,110,244,.11)');x.restore();
const dark=1-eo(sg(t,.6,1.3));if(dark>0){x.fillStyle=`rgba(0,0,0,${dark})`;x.fillRect(0,0,W,H);}}
const IMPACTS=[[.62,.9,16],[1.45,.2,8],[3.62,.45,0],[4.4,.15,8],[7.27,.3,0],[8.05,.5,12],[9.95,.2,0],[11.47,.35,0],[11.6,0,6],[13.3,.7,14],[13.85,.15,6]];
function impact(t,i){let v=0;for(const m of IMPACTS)if(t>=m[0])v=Math.max(v,m[i]*Math.exp(-(t-m[0])*(i==1?8:10)));return v;}

/* ---------- scene 1: big bang intro ---------- */
function s1(t){if(t>3.66)return;x.save();const ex=eio(sg(t,3.3,3.65));
if(ex>0){x.translate(960,420);x.scale(1+1.6*ex,1+1.6*ex);x.translate(-960,-420);}
x.save();x.globalCompositeOperation='lighter';x.lineCap='round';
for(const o of IMP){const p=sg(t,o.d,.62);if(p<=0||p>=1)continue;const r=o.r0*(1-eio(p)),co=Math.cos(o.a),si=Math.sin(o.a);
x.globalAlpha=(1-ex)*p;x.strokeStyle=o.col;x.lineWidth=2.5;x.beginPath();x.moveTo(960+co*r,540+si*r);x.lineTo(960+co*(r+o.len),540+si*(r+o.len));x.stroke();}
x.globalAlpha=1-ex;if(t<.62){const p=t/.62;glow(960,540,30+160*p*p,'rgba(170,190,255,1)');}
x.restore();
x.globalAlpha=1-ex;burst(t-.62,960,540,1);
const pa=ebk(sg(t,.62,1.0)),pm=eio(sg(t,1.0,1.45)),sy=540-250*pm,sr=(210-110*pm)*pa;
if(t>.62){x.save();x.globalCompositeOperation='lighter';rays(960,sy,950*pa,.55*(1-pm*.4),t*.25);glow(960,sy,sr*3,'rgba(90,120,255,.55)');x.restore();sparkle(960,sy,sr,(1-pa)*2+t*.15);}
const tp=sg(t,1.15,1.45);drawTitle(960,600,1+.9*(1-eo(tp)),cl(tp*4),26*(1-eo(tp)),(t>2.2&&t<2.9)?sg(t,2.2,2.9):-1);
words(t,["Google's",'new','flagship','AI','model.'],960,790,66,1.9,.09,2);
x.restore();}

/* ---------- scene 2: 3D ---------- */
const phi=(1+Math.sqrt(5))/2;
const IV=[[-1,phi,0],[1,phi,0],[-1,-phi,0],[1,-phi,0],[0,-1,phi],[0,1,phi],[0,-1,-phi],[0,1,-phi],[phi,0,-1],[phi,0,1],[-phi,0,-1],[-phi,0,1]];
const d2=(a,b)=>(a[0]-b[0])**2+(a[1]-b[1])**2+(a[2]-b[2])**2,e4=(a,b)=>Math.abs(d2(a,b)-4)<.01;
const IF=[];for(let i=0;i<12;i++)for(let j=i+1;j<12;j++)for(let k=j+1;k<12;k++)if(e4(IV[i],IV[j])&&e4(IV[j],IV[k])&&e4(IV[i],IV[k]))IF.push([i,j,k]);
const PAL=[[66,133,244],[155,114,203],[234,67,53],[251,188,4],[52,168,83]];
const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],norm=a=>{const l=Math.hypot(a[0],a[1],a[2]);return[a[0]/l,a[1]/l,a[2]/l];};
const FC=IF.map(f=>[0,1,2].map(k=>(IV[f[0]][k]+IV[f[1]][k]+IV[f[2]][k])/3)),FN=FC.map(norm);
function rot(v,ax,ay){const[X,Yv,Z]=v;let co=Math.cos(ay),si=Math.sin(ay);const X1=X*co+Z*si,Z1=-X*si+Z*co;co=Math.cos(ax);si=Math.sin(ax);return[X1,Yv*co-Z1*si,Yv*si+Z1*co];}
const CAM=7,LIT=norm([-.45,.65,-.6]);
function proj(v,cx,cy,sc){const f=sc*CAM/(v[2]+CAM);return[cx+v[0]*f,cy-v[1]*f,f];}
function ico(cx,cy,sc,ax,ay,off){if(sc<2)return;const fs=[];
IF.forEach((f,i)=>{const n0=FN[i],vs=f.map(k=>rot([IV[k][0]+n0[0]*off,IV[k][1]+n0[1]*off,IV[k][2]+n0[2]*off],ax,ay));
const ce=rot([FC[i][0]+n0[0]*off,FC[i][1]+n0[1]*off,FC[i][2]+n0[2]*off],ax,ay),n=rot(n0,ax,ay);
if(dot(n,sub(ce,[0,0,-CAM]))>=0)return;fs.push({vs,i,s:Math.max(0,dot(n,LIT)),z:ce[2]});});
fs.sort((p,q)=>q.z-p.z);x.lineJoin='round';
for(const o of fs){const pts=o.vs.map(v=>proj(v,cx,cy,sc)),col=PAL[o.i%5],m=.25+.95*o.s;
x.beginPath();x.moveTo(pts[0][0],pts[0][1]);x.lineTo(pts[1][0],pts[1][1]);x.lineTo(pts[2][0],pts[2][1]);x.closePath();
x.fillStyle=`rgb(${Math.min(255,col[0]*m)|0},${Math.min(255,col[1]*m)|0},${Math.min(255,col[2]*m)|0})`;x.fill();
x.save();x.globalCompositeOperation='lighter';x.strokeStyle=`rgba(${col[0]},${col[1]},${col[2]},.35)`;x.lineWidth=9;x.stroke();
x.strokeStyle='rgba(255,255,255,.7)';x.lineWidth=2;x.stroke();x.restore();}}
function ringPts(t,cx,cy,sc){const out=[];for(let i=0;i<22;i++){const q=i*Math.PI*2/22+t*.9;
const v=rot([2.5*Math.cos(q),.15*Math.sin(q*3+t),2.5*Math.sin(q)],.38,0);out.push({p:proj(v,cx,cy,sc),z:v[2],i});}return out;}
function drawRing(arr,t,sc){x.save();x.globalCompositeOperation='lighter';for(const o of arr){const s=16*o.p[2]/sc;x.save();x.translate(o.p[0],o.p[1]);x.rotate(t*2+o.i);
x.globalAlpha*=o.z>0?.5:1;x.fillStyle=PALS[o.i%5];x.fillRect(-s,-s,2*s,2*s);x.restore();}x.restore();}
const STARS=Array.from({length:170},()=>({x:(rnd()-.5)*2.2,y:(rnd()-.5)*1.3,z:rnd()}));
function stars(t){const e=eo(sg(t,3.6,4.7)),dist=.22*(t-3.6)+1.3*e,len=.015+.18*(1-e);x.strokeStyle='#b4c8ff';x.lineCap='round';const ga=x.globalAlpha;
for(const s of STARS){const z=mod(s.z-dist,1)+.03,z2=z+len;x.globalAlpha=ga*(1-z)*.9;x.lineWidth=2.5*(1-z)+.5;
x.beginPath();x.moveTo(960+s.x/z*420,500+s.y/z*420);x.lineTo(960+s.x/z2*420,500+s.y/z2*420);x.stroke();}x.globalAlpha=ga;}
function neonFloor(t){const hy=720,vx=960,ga=x.globalAlpha;x.save();x.translate(vx,hy);x.scale(4,1);glow(0,0,240,'rgba(155,114,203,.5)');x.restore();
x.strokeStyle='#7aa2ff';x.lineWidth=2;
for(let i=-22;i<=22;i++){x.globalAlpha=ga*.26;x.beginPath();x.moveTo(vx+i*40,hy);x.lineTo(vx+i*360,1080);x.stroke();}
for(let k=0;k<14;k++){const f=mod(k/14+t*.5,1),y=hy+(1080-hy)*Math.pow(f,2.4);x.globalAlpha=ga*.55*f;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke();}
x.globalAlpha=ga;}
function s2(t){const a=win(t,3.6,7.3,.2);if(a<=0)return;x.save();x.globalAlpha=a;
x.save();x.globalCompositeOperation='lighter';stars(t);neonFloor(t);x.restore();
const pe=sg(t,3.6,4.3),cx=560,cy=500,sc=185*ebk(pe),ay=t+(1-eo(pe))*4,ax=.45+t*.3,bump=Math.pow(Math.sin(Math.PI*sg(t,5.2,6.6)),2);
