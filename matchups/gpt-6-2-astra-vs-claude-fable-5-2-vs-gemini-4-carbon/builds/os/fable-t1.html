<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fern OS</title>
<style>
:root{--bar:46px;--accent:#18755f;--amber:#e3a72f;--ink:#1c2526;--muted:#5c6966;--paper:#fbfaf6;--chrome:#ece9df;--tool:#f5f3ec;--line:#d8d4c6;--danger:#bf3d28}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--ink);background:#0d3233;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
button,input,textarea{font:inherit;color:inherit}
button{cursor:default}
input,textarea{user-select:text;-webkit-user-select:text}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
[hidden]{display:none!important}
svg{display:block}

/* desktop */
#desktop{position:fixed;left:0;right:0;top:0;bottom:var(--bar);overflow:hidden;background:
  radial-gradient(60vmax 40vmax at 85% 110%,rgba(227,167,47,.55),transparent 60%),
  radial-gradient(50vmax 50vmax at 8% 100%,rgba(79,195,159,.45),transparent 65%),
  radial-gradient(40vmax 30vmax at 70% 0%,rgba(47,111,208,.32),transparent 70%),
  linear-gradient(160deg,#0d3233,#14524f 55%,#1c6a5b)}
#icons{position:absolute;inset:0;padding:14px;display:flex;flex-direction:column;flex-wrap:wrap;align-content:flex-start;gap:6px}
.dicon{width:86px;padding:8px 4px 6px;border:1px solid transparent;border-radius:10px;background:none;color:#fff;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.dicon svg{width:44px;height:44px;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.dicon:hover{background:rgba(255,255,255,.1)}
.dicon.sel,.dicon:focus-visible{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);outline:none}
#windows{position:absolute;inset:0;pointer-events:none}

/* windows */
.win{position:absolute;display:flex;flex-direction:column;border-radius:10px;background:var(--paper);box-shadow:0 0 0 1px rgba(0,0,0,.16),0 8px 24px rgba(0,0,0,.22);pointer-events:auto;outline:none;animation:pop .14s ease-out}
.win.active{box-shadow:0 0 0 1px rgba(0,0,0,.22),0 20px 54px rgba(0,0,0,.4)}
.win.hidden{display:none}
.win.max{border-radius:0}
@keyframes pop{from{opacity:0;transform:scale(.97)}}
.tb{flex:none;height:36px;display:flex;align-items:center;gap:8px;padding:0 4px 0 10px;background:#f4f2ec;color:var(--muted);border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;touch-action:none}
.win.active .tb{background:var(--chrome);color:var(--ink)}
.win.max .tb{border-radius:0}
.tb-ico svg{width:18px;height:18px}
.tb-title{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:13px}
.wb{flex:none;width:30px;height:26px;border:0;background:none;border-radius:6px;display:grid;place-items:center}
.wb svg{width:12px;height:12px}
.wb:hover{background:rgba(0,0,0,.09)}
.wb.x:hover{background:var(--danger);color:#fff}
.body{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;border-radius:0 0 10px 10px;background:var(--paper)}
.win.max .body{border-radius:0}
.rs{position:absolute;z-index:5;touch-action:none}
.rs.n{top:-5px;left:8px;right:8px;height:9px;cursor:ns-resize}
.rs.s{bottom:-5px;left:8px;right:8px;height:9px;cursor:ns-resize}
.rs.e{right:-5px;top:8px;bottom:8px;width:9px;cursor:ew-resize}
.rs.w{left:-5px;top:8px;bottom:8px;width:9px;cursor:ew-resize}
.rs.ne,.rs.nw,.rs.se,.rs.sw{width:13px;height:13px}
.rs.ne{top:-5px;right:-5px;cursor:nesw-resize}
.rs.sw{bottom:-5px;left:-5px;cursor:nesw-resize}
.rs.nw{top:-5px;left:-5px;cursor:nwse-resize}
.rs.se{bottom:-5px;right:-5px;cursor:nwse-resize}
.win.max .rs{display:none}

/* shared app chrome */
.bar{flex:none;display:flex;align-items:center;flex-wrap:wrap;gap:6px;padding:6px 8px;background:var(--tool);border-bottom:1px solid var(--line)}
.bar.foot{border-bottom:0;border-top:1px solid var(--line)}
.btn{height:28px;padding:0 10px;border:1px solid var(--line);background:#fff;border-radius:6px;white-space:nowrap}
.btn:hover{background:#efede5}
.btn:disabled{opacity:.45}
.btn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.danger{background:var(--danger);border-color:var(--danger)}
.btn.ib{width:30px;padding:0;display:grid;place-items:center}
.btn svg{width:16px;height:16px}
.grp{display:flex;gap:4px}
.sep{flex:none;width:1px;height:20px;background:var(--line);margin:0 2px}
.grow{flex:1}
.status{flex:none;display:flex;justify-content:space-between;gap:14px;padding:4px 10px;font-size:12px;color:var(--muted);background:var(--tool);border-top:1px solid var(--line);white-space:nowrap;overflow:hidden}
.ell{min-width:0;overflow:hidden;text-overflow:ellipsis}

/* notepad */
.np-text{flex:1;min-height:0;width:100%;border:0;outline:0;resize:none;padding:12px 14px;background:#fffdf6;font:14px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre-wrap}
.np-text.nowrap{white-space:pre;overflow-x:auto}

/* paint */
.pv{flex:1;min-height:0;display:grid;place-items:center;overflow:hidden;background:#cdc9bc}
.pc{background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.25);cursor:crosshair;touch-action:none}
.rng{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.rng input{width:90px;accent-color:var(--accent)}
.rng output{width:20px;text-align:right;font-variant-numeric:tabular-nums}
.sw{flex:none;width:22px;height:22px;padding:0;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px #b9b5a7}
.sw.on{box-shadow:0 0 0 2px var(--accent)}
.cpick{width:34px;height:26px;padding:0;border:1px solid var(--line);border-radius:6px;background:#fff}

/* calculator */
.calc{flex:1;min-height:0;display:flex;flex-direction:column;gap:10px;padding:10px;background:#202d2b;color:#fff}
.calc-disp{flex:none;text-align:right;padding:4px 6px;overflow:hidden}
.calc-expr{height:18px;font-size:13px;color:#a4b8b1;white-space:nowrap}
.calc-val{height:44px;line-height:44px;font-size:36px;font-weight:300;white-space:nowrap;font-variant-numeric:tabular-nums}
.calc-keys{flex:1;min-height:0;display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:6px}
.ck{border:0;border-radius:8px;background:#34453f;color:#fff;font-size:18px;touch-action:manipulation}
.ck:hover{filter:brightness(1.15)}
.ck:active{filter:brightness(.88)}
.ck.fn{background:#4b5f58}
.ck.op{background:var(--amber);color:#2a1e00}
.ck.eq{background:#1f8a70}
.ck:focus-visible{outline-color:#fff}

/* files */
.crumbs{flex:1;min-width:120px;height:28px;display:flex;align-items:center;gap:2px;padding:0 4px;border:1px solid var(--line);border-radius:6px;background:#fff;overflow:hidden}
.crumb{flex:none;border:0;background:none;padding:2px 6px;border-radius:4px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb:hover{background:#efede5}
.csep{color:var(--muted)}
.fx{flex:1;min-height:0;display:flex}
.fx-side{flex:none;width:132px;display:flex;flex-direction:column;gap:2px;padding:8px 6px;background:var(--tool);border-right:1px solid var(--line)}
.fx-side button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:6px 8px;border-radius:6px;text-align:left}
.fx-side button:hover{background:#e9e6dc}
.fx-side button.on{background:#dcefe8}
.fx-side svg{width:18px;height:18px;flex:none}
.fx-grid{flex:1;min-width:0;overflow:auto;padding:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));grid-auto-rows:min-content;align-content:start;gap:6px}
.fi{min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:1px solid transparent;border-radius:8px;background:none}
.fi:hover{background:#f0eee6}
.fi.sel{background:#dcefe8;border-color:#9fd0bf}
.fi svg,.fi img{width:44px;height:44px;flex:none}
.fi img{object-fit:cover;border-radius:4px;border:1px solid var(--line);background:#fff;-webkit-user-drag:none}
.fi span{max-width:100%;font-size:12px;text-align:center;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fx-empty{grid-column:1/-1;padding:34px 10px;text-align:center;color:var(--muted)}

/* about */
.about{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding:22px 24px;text-align:center}
.about-logo{width:64px;height:64px;border-radius:16px;background:#12403d;display:grid;place-items:center}
.about-logo svg{width:44px;height:44px}
.about h2{margin:4px 0 0;font-size:20px}
.about p{margin:0}
.about .dim{color:var(--muted);font-size:13px;margin-bottom:8px}

/* taskbar */
#taskbar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);z-index:9000;display:flex;align-items:center;gap:6px;padding:0 8px;background:rgba(13,25,26,.86);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.1);color:#eef3f0}
#taskbar :focus-visible,#startmenu :focus-visible{outline-color:#fff}
#startbtn{flex:none;height:34px;display:flex;align-items:center;gap:6px;padding:0 12px 0 8px;border:0;border-radius:8px;background:rgba(255,255,255,.1);font-weight:600}
#startbtn:hover,#startbtn.on{background:rgba(255,255,255,.2)}
#startbtn svg{width:22px;height:22px}
#tasks{flex:1;min-width:0;display:flex;gap:4px;overflow:hidden}
.task{position:relative;flex:0 1 170px;min-width:38px;height:34px;display:flex;align-items:center;gap:7px;padding:0 10px;border:0;border-radius:8px;background:transparent;font-size:13px}
.task:hover{background:rgba(255,255,255,.1)}
.task.active{background:rgba(255,255,255,.16)}
.task svg{width:18px;height:18px;flex:none}
.task span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.task::after{content:"";position:absolute;left:50%;bottom:2px;width:12px;height:3px;border-radius:2px;background:rgba(255,255,255,.4);transform:translateX(-50%)}
.task.active::after{width:22px;background:var(--amber)}
#clock{flex:none;padding:0 6px;text-align:right;font-size:12px;line-height:1.3;font-variant-numeric:tabular-nums}
#clock b{display:block;font-size:13px;font-weight:600}

/* start menu */
#startmenu{position:fixed;left:8px;bottom:calc(var(--bar) + 8px);z-index:9001;width:min(270px,calc(100vw - 16px));padding:8px;border-radius:12px;background:rgba(16,30,31,.96);color:#eef3f0;box-shadow:0 0 0 1px rgba(255,255,255,.1),0 18px 50px rgba(0,0,0,.5);display:flex;flex-direction:column;gap:2px}
.sm-head{padding:6px 10px 8px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#a4b8b1}
.sm-item{display:flex;align-items:center;gap:12px;width:100%;padding:7px 10px;border:0;border-radius:8px;background:none;text-align:left}
.sm-item:hover,.sm-item:focus-visible{background:rgba(255,255,255,.12)}
.sm-item svg{width:28px;height:28px;flex:none}

/* modal + toasts */
.modal-ov{position:fixed;inset:0;z-index:9400;display:grid;place-items:center;padding:16px;background:rgba(8,18,18,.5)}
.modal{width:min(360px,100%);padding:18px;border-radius:12px;background:var(--paper);box-shadow:0 24px 60px rgba(0,0,0,.45)}
.modal h2{margin:0 0 6px;font-size:16px}
.modal p{margin:0 0 12px;color:var(--muted)}
.inp{width:100%;height:32px;padding:0 9px;margin-bottom:14px;border:1px solid #b9b5a7;border-radius:6px;background:#fff}
.modal-btns{display:flex;justify-content:flex-end;gap:8px}
#toasts{position:fixed;right:12px;bottom:calc(var(--bar) + 12px);z-index:9500;display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}
.toast{max-width:min(340px,calc(100vw - 24px));padding:9px 13px;border-radius:8px;background:#12201f;color:#fff;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.35);animation:pop .15s ease-out}

@media (max-width:520px){
  #startbtn span{display:none}
  #startbtn{padding:0 8px}
  .fx-side{display:none}
  .task span{display:none}
  .task{flex:0 0 40px;justify-content:center}
}
@media (prefers-reduced-motion:reduce){.win,.toast{animation:none}}
</style>
</head>
<body>
<main id="desktop" aria-label="Desktop">
  <div id="icons"></div>
  <div id="windows"></div>
</main>

<div id="startmenu" role="menu" aria-label="Start menu" hidden></div>

<footer id="taskbar">
  <button id="startbtn" type="button" aria-haspopup="true" aria-expanded="false" aria-controls="startmenu"></button>
  <div id="tasks" role="toolbar" aria-label="Open windows"></div>
  <div id="clock" role="timer" aria-label="Clock"><b></b><span></span></div>
</footer>

<div id="toasts" role="status" aria-live="polite"></div>

<script>
(() => {
'use strict';

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const has = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
function el(tag, props, ...kids) {
  const n = document.createElement(tag);
  for (const k in (props || {})) {
    const v = props[k];
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'text') n.textContent = v;
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c);
  return n;
}
const sv = d => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + d + '</svg>';

/* ---------- icons ---------- */
const IC = {
  notepad: '<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="9" y="7" width="30" height="36" rx="4" fill="#fff6d8" stroke="#c99a2e" stroke-width="2"/><path d="M15 4v7M24 4v7M33 4v7" stroke="#8a6a1c" stroke-width="2.5" stroke-linecap="round"/><path d="M15 20h18M15 27h18M15 34h11" stroke="#c99a2e" stroke-width="2.5" stroke-linecap="round"/></svg>',
  paint: '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M24 6C13.5 6 5 13.6 5 23.5S13 41 23 41c3.200 0 4.600-1.800 4.600-3.800 0-2.600-2-3.200-2-5.600 0-2.200 1.800-3.600 4.400-3.600h4.500C39.600 28 43 24.600 43 20.400 43 12.200 34.500 6 24 6z" fill="#f6e7cf" stroke="#a9773f" stroke-width="2"/><circle cx="14.500" cy="22" r="3.200" fill="#d9483b"/><circle cx="20" cy="14" r="3.200" fill="#e3a72f"/><circle cx="29.500" cy="13.500" r="3.200" fill="#1f8a70"/><circle cx="36" cy="20" r="3.200" fill="#2f6fd0"/></svg>',
  calc: '<svg viewBox="0 0 48 48" aria-hidden="true"><rect x="10" y="5" width="28" height="38" rx="5" fill="#2e3f3c" stroke="#16211f" stroke-width="2"/><rect x="14" y="9.500" width="20" height="9" rx="2" fill="#bfe6d6"/><g fill="#f3efe4"><circle cx="17" cy="25" r="2.300"/><circle cx="24" cy="25" r="2.300"/><circle cx="17" cy="31.500" r="2.300"/><circle cx="24" cy="31.500" r="2.300"/><circle cx="17" cy="38" r="2.300"/><circle cx="24" cy="38" r="2.300"/></g><g fill="#e3a72f"><circle cx="31" cy="25" r="2.300"/><rect x="28.700" y="29.200" width="4.600" height="11.100" rx="2.300"/></g></svg>',
  folder: '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M5 13a4 4 0 0 1 4-4h9.500l4.500 5H39a4 4 0 0 1 4 4v19a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z" fill="#d6951f"/><path d="M5 20a4 4 0 0 1 4-4h30a4 4 0 0 1 4 4v17a4 4 0 0 1-4 4H9a4 4 0 0 1-4-4z" fill="#f2bd4b"/></svg>',
  text: '<svg viewBox="0 0 48 48" aria-hidden="true"><path d="M12 5h17l9 9v26a3 3 0 0 1-3 3H12a3 3 0 0 1-3-3V8a3 3 0 0 1 3-3z" fill="#fff" stroke="#9aa7a2" stroke-width="2"/><path d="M29 5v9h9" fill="#e4e9e6" stroke="#9aa7a2" stroke-width="2" stroke-linejoin="round"/><path d="M15 23h18M15 29h18M15 35h11" stroke="#9aa7a2" stroke-width="2.200" stroke-linecap="round"/></svg>',
  about: '<svg viewBox="0 0 48 48" aria-hidden="true"><circle cx="24" cy="24" r="18" fill="#2f6fd0"/><circle cx="24" cy="15.500" r="2.600" fill="#fff"/><rect x="21.600" y="21" width="4.800" height="14" rx="2.400" fill="#fff"/></svg>',
  logo: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22V9" stroke="#bfe6d6" stroke-width="1.800" stroke-linecap="round"/><path d="M12 10c0-4-3-6.500-7-7 0 4 2.500 7 7 7zM12 14c0-4 3-6.500 7-7 0 4-2.500 7-7 7zM12 18.500c0-3-2.200-5-5.500-5.500 0 3.200 2 5.500 5.500 5.500z" fill="#4fc39f"/></svg>'
};
const G = {
  min: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.500" stroke-linecap="round" aria-hidden="true"><path d="M2 6h8"/></svg>',
  max: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.500" aria-hidden="true"><rect x="2" y="2" width="8" height="8" rx="1"/></svg>',
  x: '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.500" stroke-linecap="round" aria-hidden="true"><path d="M2.500 2.500l7 7M9.500 2.500l-7 7"/></svg>'
};

/* ---------- storage (falls back to memory if the browser blocks it) ---------- */
const store = (() => {
  const mem = {};
  let ok = true;
  try { localStorage.setItem('fernos.test', '1'); localStorage.removeItem('fernos.test'); } catch (e) { ok = false; }
  return {
    persistent: ok,
    get(k) { if (ok) { try { return localStorage.getItem(k); } catch (e) {} } return has(mem, k) ? mem[k] : null; },
    set(k, v) { if (!ok) { mem[k] = v; return true; } try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  };
})();
const FS_KEY = 'fernos.fs.v1', LAST_KEY = 'fernos.notepad.last';
const FULL = 'Couldn\u2019t save: this browser\u2019s storage is full.';
const SAVED = store.persistent ? 'Saved' : 'Kept until this tab closes';

/* ---------- toasts + modal ---------- */
function toast(msg) {
  const t = el('div', { class: 'toast', text: msg });
  $('#toasts').append(t);
  setTimeout(() => t.remove(), 3600);
}
function modal({ title, message, value = null, okText = 'OK', danger = false }) {
  return new Promise(resolve => {
    const prev = document.activeElement;
    const input = value !== null ? el('input', { class: 'inp', type: 'text', maxlength: '60', autocomplete: 'off', spellcheck: 'false', 'aria-label': title }) : null;
    if (input) input.value = value;
    const ok = el('button', { class: 'btn primary' + (danger ? ' danger' : ''), type: 'submit', text: okText });
    const cancel = el('button', { class: 'btn', type: 'button', text: 'Cancel' });
    const form = el('form', { class: 'modal', role: 'dialog', 'aria-modal': 'true', 'aria-label': title },
      el('h2', { text: title }), el('p', { text: message }), input, el('div', { class: 'modal-btns' }, cancel, ok));
    const ov = el('div', { class: 'modal-ov' }, form);
    const done = v => { ov.remove(); if (prev && prev.isConnected && prev.focus) prev.focus(); resolve(v); };
    form.addEventListener('submit', e => { e.preventDefault(); done(input ? input.value : true); });
    cancel.addEventListener('click', () => done(null));
    ov.addEventListener('pointerdown', e => { if (e.target === ov) done(null); });
    form.addEventListener('keydown', e => {
      if (e.key === 'Escape') { e.stopPropagation(); done(null); }
      else if (e.key === 'Tab') {
        const f = [...form.querySelectorAll('input,button')];
        const i = f.indexOf(document.activeElement);
        e.preventDefault();
        f[(i + (e.shiftKey ? -1 : 1) + f.length) % f.length].focus();
      }
    });
    document.body.append(ov);
    if (input) { input.focus(); const dot = value.lastIndexOf('.'); input.setSelectionRange(0, dot > 0 ? dot : value.length); }
    else ok.focus();
  });
}

/* ---------- virtual file system ---------- */
let root = null;
const subs = new Set();
const subscribe = f => { subs.add(f); return () => subs.delete(f); };
const emit = ev => [...subs].forEach(f => { try { f(ev); } catch (e) { console.error(e); } });
const split = p => p.split('/').filter(Boolean);

    if (tool === 'eraser') setTool('brush');
  };
  const swGrp = el('div', { class: 'grp', role: 'group', 'aria-label': 'Colours' });
  for (const c of PALETTE) {
    const s = el('button', { class: 'sw', type: 'button', 'data-c': c, title: c, 'aria-label': 'Colour ' + c, style: 'background:' + c });
    s.addEventListener('click', () => setColor(c));

  }

  setColor(color);

  const pos = e => {
    const r = cv.getBoundingClientRect();

  };
  function flood(x, y) {
    const img = grab(), d = new Uint32Array(img.data.buffer);
    const n = parseInt(color.slice(1), 16);
    const fillc = (0xff000000 | (n & 255) << 16 | (n >> 8 & 255) << 8 | (n >> 16 & 255)) >>> 0;
    const t = d[y * W + x];
    const tr = t & 255, tg = t >> 8 & 255, tb2 = t >> 16 & 255;
    const seen = new Uint8Array(W * H), stack = [y * W + x];
    while (stack.length) {
      const i = stack.pop();
      if (seen[i]) continue;

      d[i] = fillc;
      const px = i % W;
      if (px > 0) stack.push(i - 1);
      if (px < W - 1) stack.push(i + 1);
      if (i >= W) stack.push(i - W);
      if (i < W * (H - 1)) stack.push(i + W);

  }
  function shape(x0, y0, x1, y1, shift) {
    ctx.beginPath();
    if (tool === 'line') { ctx.moveTo(x0, y0); ctx.lineTo(x1, y1); }
    else {
      let w = x1 - x0, h = y1 - y0;
      if (shift) { const m = Math.max(Math.abs(w), Math.abs(h)); w = (w < 0 ? -1 : 1) * m; h = (h < 0 ? -1 : 1) * m; }
      if (tool === 'rect') ctx.rect(x0, y0, w, h);
      else ctx.ellipse(x0 + w / 2, y0 + h / 2, Math.abs(w / 2), Math.abs(h / 2), 0, 0, Math.PI * 2);

    ctx.strokeStyle = ctx.fillStyle = tool === 'eraser' ? '#ffffff' : color;

      ctx.stroke();
    } else {

      shape(sx, sy, p.x, p.y, e.shiftKey);
    }
  });

  cv.addEventListener('pointerup', end);
  cv.addEventListener('pointercancel', end);

  async function save() {
    let p = file;
    if (!p) {
      const name = await askName('Save picture', 'Name this picture. It will be saved in Pictures.', 'Drawing.png', '.png', 'Save');
      if (!name) return;
      const dir = homeDir('Pictures');
      p = join(dir, uniqueName(dir, name));
    }
    let data;
    try { data = cv.toDataURL('image/png'); } catch (e) { toast('This picture can\u2019t be saved.'); return; }
    if (writeFile(p, data, 'image')) { file = p; label(); toast('Saved to ' + p); }
    else toast(FULL);
  }
  bSave.addEventListener('click', save);
  win.el.addEventListener('keydown', e => {
    if (!(e.ctrlKey || e.metaKey)) return;
    const k = e.key.toLowerCase();
    if (k === 'z') { e.preventDefault(); if (e.shiftKey) doRedo(); else doUndo(); }
    else if (k === 'y') { e.preventDefault(); doRedo(); }
    else if (k === 's') { e.preventDefault(); save(); }
  });

  const pv = el('div', { class: 'pv' }, cv);
  const fit = () => {
    if (pv.clientWidth < 1 || pv.clientHeight < 1) return;
    const s = clamp(Math.min((pv.clientWidth - 24) / W, (pv.clientHeight - 24) / H), .1, 3);
    cv.style.width = Math.round(W * s) + 'px'; cv.style.height = Math.round(H * s) + 'px';
  };
  win.body.append(
    el('div', { class: 'bar' }, toolGrp, el('span', { class: 'sep' }), el('label', { class: 'rng' }, 'Size', sizeIn, sizeOut),
      el('span', { class: 'sep' }), bUndo, bRedo, bClear, el('span', { class: 'grow' }), bSave),
    pv,
    el('div', { class: 'bar foot' }, swGrp, picker));
  if (window.ResizeObserver) { ro = new ResizeObserver(fit); ro.observe(pv); }
  else window.addEventListener('resize', fit);
  fit();

  unsub = subscribe(ev => {
    if (!file) return;
    if (ev.type === 'rename' && under(file, ev.from)) { file = ev.to + file.slice(ev.from.length); label(); }
    else if ((ev.type === 'remove' && under(file, ev.path)) || ev.type === 'reset') { file = null; label(); }
  });

  if (path) {
    const n = getNode(path);
    if (n && n.type === 'file' && n.kind === 'image') {
      const im = new Image();
      im.onload = () => {
        blank();
        const s = Math.min(W / im.width, H / im.height), w = im.width * s, h = im.height * s;
        ctx.drawImage(im, (W - w) / 2, (H - h) / 2, w, h);
        undo.length = redo.length = 0; syncUndo();
      };
      im.onerror = () => toast('That picture couldn\u2019t be loaded.');
      im.src = n.data;
      file = path; label();
    }
  }
}

/* ---------- Calculator ---------- */
const single = { calc: null, about: null };
function openCalc() {
  if (single.calc) { focusWin(single.calc); return; }
  const SYM = { '+': '+', '-': '\u2212', '*': '\u00d7', '/': '\u00f7' };
  let cur = '0', acc = null, op = null, replace = true, operand = false, last = null, err = '', expr = '';
  const exprEl = el('div', { class: 'calc-expr' });
  const valEl = el('div', { class: 'calc-val', role: 'status', 'aria-live': 'polite' });
  const fmt = n => {
    const r = parseFloat(n.toPrecision(12));
    let s = String(r);
    if (s.length > 14) s = r.toExponential(8).replace(/\.?0+e/, 'e');
    return s;
  };
  const show = () => {
    const s = err || cur.replace(/-/g, '\u2212');
    valEl.textContent = s;
    valEl.style.fontSize = (s.length <= 10 ? 36 : Math.max(15, Math.floor(360 / s.length))) + 'px';
    exprEl.textContent = expr;
  };
  const reset = () => { cur = '0'; acc = null; op = null; replace = true; operand = false; last = null; expr = ''; };
  const fail = m => { reset(); err = m; };
  const apply = (a, b, o) => {
    if (o === '/' && b === 0) { fail('Can\u2019t divide by 0'); return null; }
    const r = o === '+' ? a + b : o === '-' ? a - b : o === '*' ? a * b : a / b;
    if (!isFinite(r)) { fail('Too large'); return null; }
    return r;
  };
  function press(k) {
    const isDigit = /^[0-9.]$/.test(k);
    if (err) { err = ''; if (!isDigit && k !== 'C') { show(); return; } }
    if (isDigit) {
      if (replace) { cur = k === '.' ? '0.' : k; replace = false; if (op === null) { expr = ''; last = null; } }
      else if (k === '.') { if (!cur.includes('.')) cur += '.'; }
      else if (cur.replace(/\D/g, '').length < 15) cur = cur === '0' ? k : cur + k;
      operand = true;
    } else if (has(SYM, k)) {
      const v = parseFloat(cur);
      if (op !== null && operand) {
        const r = apply(acc, v, op);
        if (r === null) { show(); return; }
        acc = r; cur = fmt(r);
      } else acc = v;
      op = k; replace = true; operand = false; last = null;
      expr = fmt(acc) + ' ' + SYM[k];
    } else if (k === '=') {
      const v = parseFloat(cur);
      if (op !== null) {
        const r = apply(acc, v, op);
        if (r === null) { show(); return; }
        expr = fmt(acc) + ' ' + SYM[op] + ' ' + fmt(v) + ' =';
        last = { op, b: v }; cur = fmt(r); op = null; acc = null;
      } else if (last) {
        const r = apply(v, last.b, last.op);
        if (r === null) { show(); return; }
        expr = fmt(v) + ' ' + SYM[last.op] + ' ' + fmt(last.b) + ' =';
        cur = fmt(r);
      }
      replace = true; operand = false;
    } else if (k === 'C') reset();
    else if (k === 'back') {
      if (!replace) { cur = cur.slice(0, -1); if (cur === '' || cur === '-') cur = '0'; }
    } else if (k === 'neg') {
      if (parseFloat(cur) !== 0) { cur = cur.charAt(0) === '-' ? cur.slice(1) : '-' + cur; operand = true; }
    } else if (k === '%') {
      const v = parseFloat(cur);
      cur = fmt((op === '+' || op === '-') && acc !== null ? acc * v / 100 : v / 100);
      replace = true; operand = true;
    }
    show();
  }
  const KEYS = [
    ['C', 'C', 'fn', 'Clear'], ['neg', '\u00b1', 'fn', 'Change sign'], ['%', '%', 'fn', 'Percent'], ['/', '\u00f7', 'op', 'Divide'],
    ['7'], ['8'], ['9'], ['*', '\u00d7', 'op', 'Multiply'],
    ['4'], ['5'], ['6'], ['-', '\u2212', 'op', 'Subtract'],
    ['1'], ['2'], ['3'], ['+', '+', 'op', 'Add'],
    ['0'], ['.', '.', '', 'Decimal point'], ['back', '\u232b', 'fn', 'Backspace'], ['=', '=', 'eq', 'Equals']
  ];
  const keys = el('div', { class: 'calc-keys' });
  for (const [k, lab, cls, aria] of KEYS) {
    const b = el('button', { class: 'ck ' + (cls || ''), type: 'button', text: lab || k, 'aria-label': aria || k });
    b.addEventListener('click', () => press(k));
    keys.append(b);
  }
  const win = makeWindow({ title: 'Calculator', icon: IC.calc, w: 300, h: 440, minW: 230, minH: 330, onClose() { single.calc = null; } });
  single.calc = win;
  win.el.addEventListener('keydown', e => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const k = e.key;
    const m = /^[0-9]$/.test(k) ? k : (k === '.' || k === ',') ? '.' : (k === '+' || k === '-' || k === '*' || k === '/' || k === '%') ? k
      : (k === 'x' || k === 'X') ? '*' : (k === 'Enter' || k === '=') ? '=' : k === 'Backspace' ? 'back'
      : (k === 'Escape' || k === 'Delete' || k === 'c' || k === 'C') ? 'C' : null;
    if (m) { e.preventDefault(); press(m); }
  });
  win.body.append(el('div', { class: 'calc' }, el('div', { class: 'calc-disp' }, exprEl, valEl), keys));
  show();
}

/* ---------- Files ---------- */
function openFiles(start) {
  let cwd = start && isDir(start) ? start : '/', sel = null, unsub = () => {};
  const mk = t => el('button', { class: 'btn', type: 'button', text: t });
  const crumbs = el('div', { class: 'crumbs' });
  const bUp = el('button', { class: 'btn ib', type: 'button', title: 'Up one level', 'aria-label': 'Up one level', html: sv('<path d="M12 19V6M6 12l6-6 6 6"/>') });
  const bFolder = mk('New folder'), bNote = mk('New note'), bOpen = mk('Open'), bRen = mk('Rename'), bDel = mk('Delete');
  const side = el('nav', { class: 'fx-side', 'aria-label': 'Places' });
  const grid = el('div', { class: 'fx-grid' });
  const status = el('div', { class: 'status' });
  const win = makeWindow({ title: 'Files', icon: IC.folder, w: 660, h: 430, minW: 330, minH: 260, onClose() { unsub(); } });

  function updateSel() {
    const d = getNode(cwd);
    grid.querySelectorAll('.fi').forEach(b => {
      const on = b.dataset.name === sel;
      b.classList.toggle('sel', on); b.setAttribute('aria-pressed', on);
    });
    bOpen.disabled = bRen.disabled = bDel.disabled = !sel;
    if (sel) {
      const n = d.children[sel];
      if (n.type === 'dir') { const k = Object.keys(n.children).length; status.textContent = sel + ' \u2014 folder, ' + k + (k === 1 ? ' item' : ' items'); }
      else status.textContent = sel + ' \u2014 ' + fmtSize(sizeOf(n)) + ' \u2014 changed ' + fmtDate(n.mtime);
    } else {
      const k = Object.keys(d.children).length;
      status.textContent = k + (k === 1 ? ' item' : ' items');
    }
  }
  function render() {
    while (!isDir(cwd)) cwd = dirname(cwd);
    const d = getNode(cwd);
    if (sel && !has(d.children, sel)) sel = null;
    win.setTitle((cwd === '/' ? 'Home' : basename(cwd)) + ' \u2014 Files');
    crumbs.replaceChildren();
    const add = (text, p) => crumbs.append(el('button', { class: 'crumb', type: 'button', text, onclick: () => go(p) }));
    add('Home', '/');
    let acc = '';
    for (const part of split(cwd)) { acc += '/' + part; crumbs.append(el('span', { class: 'csep', text: '\u203a' })); add(part, acc); }
    bUp.disabled = cwd === '/';
    side.replaceChildren(...[['Home', '/'], ['Documents', '/Documents'], ['Pictures', '/Pictures']].filter(x => isDir(x[1]))
      .map(x => el('button', { type: 'button', class: x[1] === cwd ? 'on' : '', html: IC.folder, onclick: () => go(x[1]) }, el('span', { text: x[0] }))));
    const names = Object.keys(d.children).sort((a, b) => {
      const A = d.children[a].type === 'dir' ? 0 : 1, B = d.children[b].type === 'dir' ? 0 : 1;
      return A - B || a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
    });
    grid.replaceChildren();
    if (!names.length) grid.append(el('div', { class: 'fx-empty', text: 'This folder is empty.' }));
    for (const name of names) {
      const n = d.children[name];
      const b = el('button', { class: 'fi', type: 'button', 'data-name': name, title: name });
      if (n.type === 'file' && n.kind === 'image') { const im = el('img', { alt: '', draggable: 'false' }); im.src = n.data; b.append(im); }
      else b.innerHTML = n.type === 'dir' ? IC.folder : IC.text;
      b.append(el('span', { text: name }));
      grid.append(b);
    }
    updateSel();
  }
  function go(p) { cwd = p; sel = null; render(); }
  function openItem(name) {
    const d = getNode(cwd);
    if (!d || !has(d.children, name)) return;
    const n = d.children[name], p = join(cwd, name);
    if (n.type === 'dir') go(p);
    else if (n.kind === 'image') openPaint(p);
    else openNotepad(p);
  }
  async function rename() {
    if (!sel) return;
    const old = sel, dir = cwd;
    const raw = await modal({ title: 'Rename', message: 'Enter a new name for \u201c' + old + '\u201d.', value: old, okText: 'Rename' });
    if (raw === null) return;
    const name = cleanName(raw);
    if (!name) { toast('Please enter a name.'); return; }
    if (name === old) return;
    const d = getNode(dir);
    if (!d || !has(d.children, old)) return;
    if (has(d.children, name)) { toast('\u201c' + name + '\u201d already exists here.'); return; }
    if (renameNode(dir, old, name) && cwd === dir) { sel = name; updateSel(); }
  }
  async function del() {
    if (!sel) return;
    const name = sel, dir = cwd, n = getNode(join(dir, name));
    if (!n) return;
    const ok = await modal({ title: 'Delete', okText: 'Delete', danger: true,
      message: 'Delete \u201c' + name + '\u201d' + (n.type === 'dir' ? ' and everything inside it' : '') + '? This can\u2019t be undone.' });
    if (ok) removeNode(join(dir, name));
  }
  const nameOf = e => { const b = e.target.closest('.fi'); return b ? b.dataset.name : null; };
  grid.addEventListener('click', e => {
    const n = nameOf(e);
    if (n && n === sel && lastPT === 'touch') { openItem(n); return; }
    sel = n; updateSel();
  });
  grid.addEventListener('dblclick', e => { const n = nameOf(e); if (n && lastPT !== 'touch') openItem(n); });
  grid.addEventListener('keydown', e => {
    const n = nameOf(e);

  bOpen.addEventListener('click', () => { if (sel) openItem(sel); });
  bRen.addEventListener('click', rename);
  bDel.addEventListener('click', del);
  bFolder.addEventListener('click', async () => {
    const dir = cwd;
    const raw = await modal({ title: 'New folder', message: 'Name the new folder.', value: 'New folder', okText: 'Create' });
    if (raw === null) return;
    const clean = cleanName(raw);
    if (!clean) { toast('Please enter a name.'); return; }
    const name = uniqueName(dir, clean);
    if (!mkdir(dir, name)) { toast('The folder couldn\u2019t be created.'); return; }
    if (cwd === dir) { sel = name; updateSel(); }
  });
  bNote.addEventListener('click', async () => {
    const dir = cwd;
    const clean = await askName('New note', 'Name the new note. It will be created in this folder.', 'Untitled.txt', '.txt', 'Create');
    if (!clean) return;
    const name = uniqueName(dir, clean);
    if (!writeFile(join(dir, name), '', 'text')) { toast(isDir(dir) ? FULL : 'That folder no longer exists.'); return; }
    if (cwd === dir) { sel = name; updateSel(); }
  });

  win.body.append(
    el('div', { class: 'bar' }, bUp, crumbs),
    el('div', { class: 'bar' }, bFolder, bNote, el('span', { class: 'sep' }), bOpen, bRen, bDel),
    el('div', { class: 'fx' }, side, grid),
    status);
  unsub = subscribe(ev => { if (ev.type === 'change') render(); });
  render();
}
