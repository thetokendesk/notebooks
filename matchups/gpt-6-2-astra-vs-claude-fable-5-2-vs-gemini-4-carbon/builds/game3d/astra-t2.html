<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">

<title>Aftertide • Manta Rally</title>
<style>
:root{--paper:#fff1d4;--mint:#88ffda;--orange:#ff8549;--pink:#ff7ab6;--ink:#102733;--line:#ffefd044}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#142d39;color:var(--paper);font-family:Arial,Helvetica,sans-serif}
body{touch-action:none;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
button:focus-visible{outline:3px solid white;outline-offset:4px}
[hidden]{display:none!important}
#world{position:absolute;inset:0;width:100%;height:100%;display:block}
#vignette{position:absolute;inset:0;pointer-events:none;background:linear-gradient(#10233177,transparent 22%,transparent 76%,#0b243680)}
#mast{position:absolute;z-index:4;inset:max(19px,env(safe-area-inset-top)) 4vw auto;display:flex;align-items:center;gap:12px;pointer-events:none}
.mark{width:38px;height:28px;background:var(--orange);clip-path:polygon(0 90%,35% 8%,53% 8%,18% 90%,32% 90%,67% 8%,85% 8%,50% 90%,63% 90%,96% 15%,100% 40%,80% 90%)}
.mono,.small,.brand,button{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}
.brand,.small{font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.brand{font-size:12px}.small{font-size:10px}.rule{flex:1;height:1px;background:var(--line)}
.icon{width:38px;height:34px;display:grid;place-items:center;pointer-events:auto;background:#122d39b8;border:1px solid var(--line);border-radius:3px}
.icon svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
#menu{position:absolute;inset:0;display:flex;align-items:center;padding:72px 7vw 70px;pointer-events:none;background:linear-gradient(90deg,#0c2431eb,#15293687 39%,transparent 71%)}
.poster{pointer-events:auto;max-width:570px}
.eyebrow{display:flex;align-items:center;gap:10px;color:var(--mint);font-weight:800;font-size:11px;letter-spacing:.19em;text-transform:uppercase}
.eyebrow:before{content:"";width:28px;height:3px;background:currentColor}
h1,h2,.display{font-family:Impact,Haettenschweiler,"Arial Black",sans-serif;font-weight:1000}
h1{font-size:clamp(83px,min(11vw,15.5vh),162px);line-height:.78;letter-spacing:-.08em;margin:24px 0 19px;transform:skew(-9deg);transform-origin:left bottom;text-shadow:4px 5px #1d3239}
h1 span{display:block;color:var(--orange)}
.edition{display:inline-block;background:var(--paper);color:var(--ink);padding:5px 11px;transform:skew(-8deg);font:bold 12px ui-monospace,monospace;letter-spacing:.2em}
.desc{max-width:360px;font-size:clamp(15px,1.45vw,19px);line-height:1.45;margin:17px 0 21px}
.cta{border:0;background:var(--mint);color:#102d32;padding:0 21px;height:49px;min-width:210px;display:inline-flex;align-items:center;justify-content:space-between;gap:28px;font-size:13px;font-weight:900;letter-spacing:.12em;clip-path:polygon(0 0,100% 0,100% 70%,94% 100%,0 100%)}
.cta:hover{background:#c9ffe9}.cta b{font-size:22px}
#record{margin-top:14px;font-size:11px;letter-spacing:.13em}
#foot{position:absolute;bottom:max(20px,env(safe-area-inset-bottom));left:4vw;right:4vw;display:flex;align-items:center;justify-content:space-between;gap:15px;font-size:10px;letter-spacing:.12em}
#foot b,.mint{color:var(--mint)}.touchCopy{display:none}
#hud{position:absolute;inset:74px 4vw max(22px,env(safe-area-inset-bottom));pointer-events:none;text-shadow:0 2px 7px #102536}
.top,.bottom{display:flex;align-items:flex-start;justify-content:space-between}.bottom{position:absolute;bottom:0;width:100%;align-items:flex-end}
.big{font-size:clamp(32px,4.1vw,55px);line-height:1;letter-spacing:-.055em;font-variant-numeric:tabular-nums}
.right{text-align:right}#chain{height:17px;font-weight:bold;color:var(--mint);font-size:14px;margin-top:5px}
#hull{display:flex;justify-content:flex-end;gap:4px;margin:8px 0}
#hull i{width:20px;height:7px;transform:skew(-22deg);background:var(--mint)}
#hull i.off{background:#56646b}
#rank{font-weight:900;color:#fff1d4;font-size:13px}
#meter{margin:7px 0;width:155px;height:8px;background:#0e2634bb;border:1px solid #daffec77;transform:skew(-15deg)}
#fill{height:100%;transform-origin:left;background:var(--mint)}
#energy,#rollState,#readout{font-size:10px;letter-spacing:.08em}#rollState{margin-top:5px;color:var(--mint)}
#sectorName{font-size:14px;font-weight:bold;letter-spacing:.08em}
#raceTrack{position:relative;height:4px;width:150px;background:#fff1d455;margin:10px 0 8px auto}
#raceTrack:after{content:"";position:absolute;right:0;top:-3px;height:10px;border-right:2px solid var(--paper)}
.dot{position:absolute;top:50%;width:8px;height:8px;transform:translate(-50%,-50%) rotate(45deg);background:var(--mint);box-shadow:0 0 6px #172c3b}
#rivalDot{background:var(--pink);top:-1px;width:6px;height:6px}
#notice{position:absolute;top:22%;left:50%;transform:translateX(-50%);text-align:center;white-space:nowrap}
#notice strong{display:block;font-size:clamp(21px,3.5vw,47px);letter-spacing:-.035em;font-style:italic;line-height:1}
#notice small{display:block;font-size:10px;letter-spacing:.16em;margin-top:6px;font-weight:800}
#next{position:absolute;left:50%;bottom:0;transform:translateX(-50%);text-align:center;font-size:11px;letter-spacing:.09em}
#actions{position:absolute;right:4vw;bottom:95px;display:flex;gap:10px}
.round{border:1px solid #a0ffda99;background:#102b39b8;border-radius:50%;width:62px;height:62px;font-size:10px;font-weight:900;color:var(--mint)}
#overlay{position:absolute;z-index:6;inset:0;display:grid;place-items:center;padding:18px;background:#0a1b2ac4}
.card{width:min(440px,100%);max-height:95dvh;overflow:auto;padding:28px;background:#142e38;box-shadow:9px 10px #06192166;border-top:4px solid var(--orange)}
h2{margin:14px 0;font-size:clamp(43px,7vw,65px);font-style:italic;line-height:.95;letter-spacing:-.06em}
#summary{font-size:15px;line-height:1.5;margin:12px 0 20px}
.stats{margin:14px 0;display:grid;grid-template-columns:1fr auto;gap:5px 20px;font-size:12px}.stats b{text-align:right;color:var(--mint)}
#flash{position:absolute;inset:0;background:#ff7859;opacity:0;pointer-events:none}
@media(pointer:coarse){.touchCopy{display:inline}.keyCopy{display:none}}
@media(max-width:650px){.brand{font-size:10px}#mast{gap:8px;top:max(13px,env(safe-area-inset-top))}#menu{background:linear-gradient(90deg,#102735ce,transparent)}.desc{max-width:265px}#foot .loc{display:none}#foot{font-size:9px;letter-spacing:.05em}#hud{top:64px}.small{font-size:9px}#meter,#raceTrack{width:115px}#sectorName{font-size:11px}#next{bottom:73px;max-width:60%;font-size:9px}#actions{bottom:108px}.round{width:53px;height:53px}#notice{top:25%}}
@media(max-height:530px){#menu{padding:45px 7vw 24px}h1{font-size:67px;margin:10px 0}h1 span{display:inline}.edition{font-size:9px}.desc{margin:8px 0 12px}.cta{height:38px}#record{margin-top:8px}#foot{bottom:8px}#mast{top:7px}#hud{top:49px}.card{padding:16px}.stats{margin:7px 0}}
</style>
</head>
<body>
<canvas id="world" aria-label="Aftertide flying game"></canvas>
<div id="vignette"></div>
<header id="mast"><div class="mark"></div><div class="brand">AFTERTIDE / ARCADE</div><div class="rule"></div>
<button id="pause" class="icon" aria-label="Pause flight" hidden><svg viewBox="0 0 24 24"><path d="M8 5v14m8-14v14"/></svg></button>
<button id="sound" class="icon" aria-label="Mute sound" title="Sound"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path id="wave" d="M16 8q4 4 0 8m3-11q7 7 0 14"/></svg></button></header>
<section id="menu"><div class="poster"><div class="eyebrow mono">Salt Coast Championship</div><h1>AFTER<span>TIDE</span></h1><div class="edition">MANTA RALLY</div>
<p class="desc">Beat Nova to the flying carrier. Thread the rings, roll through mines, and steal the inside line.</p>
<button class="cta" id="launch">START RACE <b>↗</b></button><div id="record" class="mono"></div></div></section>
<footer id="foot" class="mono"><span class="keyCopy"><b>WASD / ARROWS</b> FLY &nbsp;·&nbsp; <b>SHIFT</b> ROLL &nbsp;·&nbsp; <b>SPACE</b> PULSE</span><span class="touchCopy"><b>DRAG</b> TO FLY &nbsp;·&nbsp; TAP <b>ROLL</b> OR <b>PULSE</b></span><span class="loc">SALT COAST &nbsp; / &nbsp; SECTOR 07</span></footer>
<div id="hud" hidden>
<div class="top"><div><div class="small">Score</div><div id="score" class="display big"></div><div id="chain" class="mono"></div></div><div class="right"><div class="small">Hull</div><div id="hull"><i></i><i></i><i></i></div><div id="rank" class="mono"></div></div></div>
<div id="notice" hidden><strong class="display" id="noticeTitle"></strong><small class="mono" id="noticeSub"></small></div>
<div class="bottom"><div><div class="small">Overdrive</div><div id="meter"><div id="fill"></div></div><div id="energy" class="mono"></div><div id="rollState" class="mono"></div></div>
<div class="right"><div id="sectorName" class="mono"></div><div id="raceTrack"><i class="dot" id="rivalDot"></i><i class="dot" id="playerDot"></i></div><div id="readout" class="mono"></div></div></div>
<div id="next" class="mono"></div></div>
<div id="actions" hidden><button class="round" id="rollTouch">ROLL</button><button class="round" id="boostTouch">PULSE</button></div>
<div id="flash"></div>
<section id="overlay" hidden><div class="card"><div class="eyebrow mono" id="cardBrow"></div><h2 id="cardTitle"></h2><div id="summary"></div><button class="cta" id="cardButton"></button></div></section>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const $=s=>document.getElementById(s),canvas=$('world'),touch=matchMedia('(pointer:coarse)').matches;
const TAU=Math.PI*2,clamp=T.MathUtils.clamp,lerp=T.MathUtils.lerp;
const damp=(a,b,k,dt)=>lerp(a,b,1-Math.exp(-k*dt));
const hash=n=>{const v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)};
const fmt=n=>Math.floor(n).toLocaleString('en-US');
const clockText=t=>`${Math.floor(t/60)}:${(t%60).toFixed(2).padStart(5,'0')}`;
const scene=new T.Scene(),cam=new T.PerspectiveCamera(62,1,.14,670);
let renderer;
try{renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'})}
catch(e){$('launch').disabled=true;$('launch').textContent='WEBGL UNAVAILABLE';throw e}
renderer.setClearColor(0xf5b793);
scene.fog=new T.FogExp2(0xf5b99c,.006);
const sun=new T.DirectionalLight(0xffdfb1,2.35);sun.position.set(-38,55,-32);
scene.add(sun,new T.HemisphereLight(0xffe5ce,0x548898,1.95));
const standard=(color,metalness=.13,roughness=.58)=>new T.MeshStandardMaterial({color,metalness,roughness,flatShading:true,side:T.DoubleSide});
const flat=color=>new T.MeshBasicMaterial({color,side:T.DoubleSide});
function mesh(g,m,p=scene){const o=new T.Mesh(g,m);p.add(o);return o}
function box(p,x,y,z,w,h,d,m){const o=mesh(new T.BoxGeometry(w,h,d),m,p);o.position.set(x,y,z);return o}
function group(p=scene){const g=new T.Group();p.add(g);return g}
function poly(p,verts,faces,m){
 const a=[];for(const f of faces)for(const i of f)a.push(...verts[i]);
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(a,3));g.computeVertexNormals();return mesh(g,m,p)
}

const sky=mesh(new T.SphereGeometry(505,40,24),new T.ShaderMaterial({
 side:T.BackSide,depthWrite:false,
 vertexShader:`varying vec3 d;void main(){d=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`varying vec3 d;void main(){vec3 n=normalize(d);float h=max(n.y,0.);vec3 c=mix(vec3(.99,.73,.56),vec3(.98,.54,.46),smoothstep(.0,.24,h));c=mix(c,vec3(.27,.47,.64),smoothstep(.14,.71,h));float r=length(n-normalize(vec3(-.27,.135,-1.)));c+=vec3(.21,.12,.05)*exp(-r*8.);float s=1.-smoothstep(.068,.07,r);s*=mix(smoothstep(.12,.23,fract((n.y+.02)*108.)),1.,smoothstep(.10,.155,n.y));gl_FragColor=vec4(mix(c,vec3(1.,.91,.64),s),1.);}`
}));
const seaU={t:{value:0},d:{value:0}};
const sea=mesh(new T.PlaneGeometry(550,535),new T.ShaderMaterial({uniforms:seaU,
 vertexShader:`varying vec3 p;void main(){p=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*viewMatrix*vec4(p,1.);}`,
 fragmentShader:`varying vec3 p;uniform float t,d;float hash(vec2 n){return fract(sin(dot(n,vec2(37.1,91.7)))*17351.31);}void main(){vec2 q=vec2(p.x,p.z-d);float w=sin(q.x*.24+q.y*.61+t*1.55)+sin(q.y*1.3-q.x*.12+t*2.);float f=smoothstep(5.,218.,-p.z);vec3 c=mix(vec3(.055,.35,.39),vec3(.94,.69,.54),f*.85)+.023*w;vec2 cell=vec2(q.x*.34+sin(q.y*1.75+t)*.44,q.y*1.08+t*.61);float s=smoothstep(.78,.98,hash(floor(cell)))*smoothstep(.2,.48,fract(cell.y))*(1.-smoothstep(.50,.76,fract(cell.y)));c+=s*(vec3(.12,.28,.26)+exp(-abs(p.x-.27*p.z)*.105)*vec3(.97,.52,.21))*(1.-f*.55);gl_FragColor=vec4(c,1.);}`
}));
sea.rotation.x=-Math.PI/2;sea.position.z=-185;
function ridge(center,width,height,z,color,seed){
 const verts=[],cols=[],base=new T.Color(color),c=new T.Color();let last;
 for(let j=0;j<=26;j++){
  const x=center+width*(j/26-.5),h=Math.sin(Math.PI*j/26)**.72*height;
  const next=[[x,1+h*(.5+.5*hash(seed+j)),z-hash(seed+j+5)*8],[x-2,h*.27,z+9+hash(seed+j+3)*5],[x,-1,z+17]];
  if(last)for(const [a,b,e,k] of [[last[0],last[1],next[0],.99],[next[0],last[1],next[1],.87],[last[1],last[2],next[1],.76],[next[1],last[2],next[2],.82]]){
   verts.push(...a,...b,...e);c.copy(base).multiplyScalar(k);for(let n=0;n<3;n++)cols.push(c.r,c.g,c.b)
  }
  last=next
 }
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(verts,3));g.setAttribute('color',new T.Float32BufferAttribute(cols,3));mesh(g,new T.MeshBasicMaterial({vertexColors:true,side:T.DoubleSide}))
}
ridge(0,500,42,-239,0xb48491,75);ridge(-112,215,35,-173,0xb7817f,9);ridge(111,165,46,-179,0xa87b80,32);

const shoreMat=new T.MeshStandardMaterial({vertexColors:true,flatShading:true,roughness:1,side:T.DoubleSide});
const strata=['#fbe3b5','#d69974','#bb796c','#d99b79','#ecc39a'].map(v=>new T.Color(v));
function coastPoint(s,i,r){
 const n=hash(i+179*s),edge=20+Math.sin(i*.19+s)*3.5+Math.sin(i*.059)*2+n*2.8;
 const h=3+8*hash(i*.14+s)+4*(1+Math.sin(i*.29+s));
 const band=[[edge,-.8],[edge+1.6,1],[edge+4+n,h*.39],[edge+6+n*3,h],[edge+11,h+1],[edge+25,h*.5]][r];
 return [s*band[0],band[1],-i*6]
}
const tiles=Array.from({length:8},()=>mesh(new T.BufferGeometry(),shoreMat));
function buildTile(tile,num){
 const a=[],rgb=[],v=new T.Color();
 for(const s of [-1,1])for(let j=0;j<8;j++)for(let r=0;r<5;r++){
  const i=num*8+j,A=coastPoint(s,i,r),B=coastPoint(s,i+1,r),C=coastPoint(s,i,r+1),D=coastPoint(s,i+1,r+1);
  for(const [k,tri] of [[0,[A,B,C]],[1,[B,D,C]]]){
   v.copy(strata[r]).multiplyScalar(.80+.23*hash(i*8+r*3+k+s));
   if(s===1)tri.reverse();
   for(const p of tri){a.push(p[0],p[1],p[2]+num*48);rgb.push(v.r,v.g,v.b)}
  }
 }
 const g=tile.geometry;g.dispose();g.setAttribute('position',new T.Float32BufferAttribute(a,3));g.setAttribute('color',new T.Float32BufferAttribute(rgb,3));g.computeVertexNormals();g.computeBoundingSphere();tile.userData.num=num
}
function shore(d){const first=Math.floor((d-30)/48);for(let i=0;i<tiles.length;i++){const n=first+i,t=tiles[(n%8+8)%8];if(t.userData.num!==n)buildTile(t,n);t.position.z=d-n*48}}

const cream=standard(0xffdfae,.31,.42),orange=standard(0xe95738,.38,.41),dark=standard(0x21343f,.55,.39),glass=standard(0x196578,.62,.19),mint=flat(0x90ffdb),pink=flat(0xff80bc),berry=standard(0xb14483,.38,.41);
const diamondFaces=[[0,1,2],[0,2,3],[0,3,4],[0,4,1],[1,5,2],[2,5,3],[3,5,4],[4,5,1]];
function skimmer(accent,light){
 const g=group(),flames=[];
 poly(g,[[0,.02,-2.36],[-.59,.04,.61],[0,.47,.56],[.59,.04,.61],[0,-.32,.55],[0,-.03,1.5]],diamondFaces,cream);
 poly(g,[[0,.22,-1.32],[-.36,.24,.26],[0,.68,.38],[.36,.24,.26],[0,.15,.25],[0,.23,.79]],diamondFaces,glass);
 for(const s of [-1,1]){
  poly(g,[[s*.28,.04,-.97],[s*2.55,-.11,1.31],[s*2.30,-.03,1.56],[s*.37,.19,1.03],[s*.84,-.19,.9]],[[0,1,3],[1,2,3],[0,4,1],[1,4,2],[2,4,3]],cream);
  poly(g,[[s*1.18,.08,-.01],[s*1.58,.055,.35],[s*1.94,.017,1.47],[s*1.50,.069,1.35]],[[0,1,2],[0,2,3]],accent);
  poly(g,[[s*1.98,0,1.24],[s*2.51,.49,1.51],[s*2.55,.54,.94],[s*2.31,.04,.78]],[[0,1,2],[0,2,3]],accent);
  box(g,s*.59,-.03,.80,.38,.37,1.59,dark);box(g,s*.59,-.03,1.61,.26,.23,.06,light);
  const geo=new T.ConeGeometry(.19,1.28,8);geo.translate(0,.64,0);
  const f=mesh(geo,light,g);f.rotation.x=Math.PI/2;f.position.set(s*.59,-.03,1.64);flames.push(f)
 }
 g.userData.flames=flames;return g
}
const player=skimmer(orange,mint),nova=skimmer(berry,pink);
function labelSprite(text,color){
 const c=document.createElement('canvas');c.width=256;c.height=64;const ctx=c.getContext('2d');
 ctx.fillStyle='#14232dcc';ctx.fillRect(10,6,236,50);ctx.strokeStyle=color;ctx.lineWidth=3;ctx.strokeRect(10,6,236,50);
 ctx.fillStyle=color;ctx.font='bold 30px monospace';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(text,128,32);
 const tex=new T.CanvasTexture(c);tex.colorSpace=T.SRGBColorSpace;
 const sp=new T.Sprite(new T.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));sp.scale.set(3.2,.8,1);return sp
}
const novaTag=labelSprite('NOVA','#ffaad2');scene.add(novaTag);
const shadow=mesh(new T.CircleGeometry(1,28),new T.MeshBasicMaterial({color:0x133841,transparent:true,opacity:.27,depthWrite:false}));shadow.rotation.x=-Math.PI/2;

const carrier=group(),wings=[],carrierDeep=standard(0x314e5a,.62,.43),carrierGold=standard(0xc58b62,.35,.58);
poly(carrier,[[0,0,-7],[-2.9,-.1,.2],[0,1.95,1.5],[2.9,-.1,.2],[0,-1,.4],[0,.1,6.8]],diamondFaces,carrierDeep);
for(const s of [-1,1]){
 const w=group(carrier);wings.push(w);
 poly(w,[[s*.7,.5,-4],[s*5.4,.8,-4.9],[s*11.4,1.3,-6.3],[s*9,.3,-1.4],[s*3.3,-.25,4.8],[s*.9,.7,3.8],[s*4.8,1.45,-.4]],[[0,1,6],[1,2,6],[2,3,6],[3,4,6],[4,5,6],[5,0,6]],carrierDeep);
 poly(w,[[s*3.4,.99,-4.3],[s*9.8,1.3,-5.7],[s*8.5,1.1,-4.65],[s*4.7,1.18,-3.85]],[[0,1,2],[0,2,3]],carrierGold);
 for(let i=0;i<4;i++)box(w,s*(3+i*1.55),.62-i*.025,2.9-i*.77,.73,.12,.29,mint);
 box(carrier,s*1.2,-.65,3.5,.5,.28,2.5,mint)
}
poly(carrier,[[-.65,.1,4],[.65,.1,4],[0,0,16],[0,1.1,7]],[[0,1,3],[0,3,2],[1,2,3]],carrierDeep);
const cableMat=standard(0x344852,.45,.6);
const carrierRingRadius=4.0;
for(const s of [-1,1]){const c=box(carrier,s*2.9,-2.7,1,.095,4.5,.1,cableMat);c.rotation.z=-s*.14}

const R=3.35,gold=standard(0xffa342,.38,.38),ringShade=standard(0x62463a,.30,.54),goldLight=flat(0xffe8a5);
const ringGeo=new T.TorusGeometry(1,.057,7,56),backGeo=new T.TorusGeometry(1.042,.041,6,56),arcGeo=new T.TorusGeometry(1,.026,5,7,.32),tabGeo=new T.BoxGeometry(.07,.20,.09);
function ring(parent,r,sizeMat,lights){
 const g=group(parent),trim=group(g);g.scale.setScalar(r);

 speed=damp(speed,32+Math.min(8.5,travel*.007)+(boost>0?23:0),2.8,dt);travel+=speed*dt;
 if(novaFinishedAt===Infinity)novaD+=npcSpeed()*dt;
 score+=speed*dt*.18;
 const horizontal=Number(keys.has('ArrowRight')||keys.has('KeyD'))-Number(keys.has('ArrowLeft')||keys.has('KeyA'));
 const vertical=Number(keys.has('ArrowUp')||keys.has('KeyW'))-Number(keys.has('ArrowDown')||keys.has('KeyS'));
 const goalX=dragControl?clamp((tx-px)*10,-25,25):horizontal*19.5,goalY=dragControl?clamp((ty-py)*10,-18,18):vertical*14;
 vx=damp(vx,goalX,10,dt);vy=damp(vy,goalY,11,dt);px=clamp(px+vx*dt,-16,16);py=clamp(py+vy*dt,1.25,13.2);if(Math.abs(vx)>2)lastSide=Math.sign(vx);
 const f=1-roll/.69,spin=roll>0?-rollDir*TAU*f*f*(3-2*f):0;
 player.position.set(px,py+Math.sin(worldTime*8)*.037,0);player.rotation.set(vy*.013,-vx*.008,-vx*.027+spin);player.visible=invul<=0||Math.sin(worldTime*30)>-.5;
 worldObjects(travel);raceEvents();if(mode!=='play')return;
 jetEmit+=dt*(boost?100:roll?75:28);while(jetEmit>=1){jetEmit--;const s=Math.random()<.5?-1:1;const a=player.rotation.z;spray(px+s*.6*Math.cos(a),py+s*.6*Math.sin(a),2.12,boost||roll?0x8effd9:0xd7f5dd,1,1.7)}
 hud()
}
function chaseCam(dt){
 camX=damp(camX,px*.80,5.5,dt);camY=damp(camY,py+2.65,5.3,dt);
 cam.position.set(camX+(Math.random()-.5)*shake*.42,camY+(Math.random()-.5)*shake*.21,innerWidth<innerHeight?13.4:10.9);
 cam.lookAt(px*.80,py-.45,-16);cam.fov=damp(cam.fov,boost?74:62,4,dt);cam.updateProjectionMatrix()
}
function countdownStep(dt){
 countdown-=dt;const n=Math.max(1,Math.ceil(countdown/0.8));
 if(n!==countValue&&countdown>0){countValue=n;message(String(n),'MANTA RALLY  /  START LINE','#ffe3ac',1);tone(260,.1,'square',.026)}
 player.position.set(0,5+Math.sin(worldTime*5)*.055,0);worldObjects(0);chaseCam(dt);
 if(countdown<=0){mode='play';$('pause').hidden=false;$('actions').hidden=!touch;message('GO!','GOLD RINGS CHARGE YOUR PULSE','var(--mint)',1.3);tone(680,.25,'triangle',.09)}
}
function attract(dt){
 travel=(travel+dt*6.5)%225;const t=worldTime,portrait=innerWidth<innerHeight;
 px=3.3+Math.sin(t*.45)*.75;py=4.75+Math.sin(t*.76)*.16;
 player.position.set(px,py,0);player.rotation.set(.035,-.22+Math.sin(t*.43)*.09,.13+Math.sin(t*.72)*.10);
 cam.position.set(portrait?px+3.7:8.2,py+2.65,portrait?11.8:8.5);cam.lookAt(portrait?px-.9:.05,py+.94,-3.5);worldObjects(travel,true)
}
function effects(dt){
 wave=Math.max(0,wave-dt);pulseWave.visible=wave>0;
 if(wave>0){const a=1-wave/.48;pulseWave.position.set(px,py,1.5+a*4);pulseWave.scale.setScalar(.6+a*9);pulseWave.material.opacity=1-a}
 streaks.visible=boost>0&&mode==='play';
 if(streaks.visible){
  for(let i=0;i<streakCount;i++){const a=i*2.39996,r=4.8+hash(i+3)*13,z=12-((hash(i)*100-worldTime*67)%100+100)%100,k=i*6,x=px+Math.cos(a)*r,y=py+Math.sin(a)*r;streakPos.set([x,y,z,x,y,z-2.5-hash(i+4)*3.8],k)}
  streakGeo.attributes.position.needsUpdate=true
 }
 for(const f of player.userData.flames)f.scale.y=(boost>0?2.9:1)*(.89+Math.sin(worldTime*47)*.14);
 for(const f of nova.userData.flames)f.scale.y=1.25+Math.sin(worldTime*40)*.14;
 shadow.position.set(px,.045,0);shadow.scale.set(2.05+py*.043,1.57+py*.055,1);shadow.material.opacity=Math.max(.07,.31-py*.017);
 flash=Math.max(0,flash-dt*1.8);shake=Math.max(0,shake-dt*1.9);$('flash').style.opacity=flash;
 if(notice>0){notice-=dt;if(notice<=0)$('notice').hidden=true}
 particles(dt,mode==='play'?speed:0)
}
function resize(){renderer.setPixelRatio(Math.min(devicePixelRatio||1,1.7));renderer.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()}
resize();window.addEventListener('resize',resize);
let last=performance.now();
function frame(now){
 requestAnimationFrame(frame);const dt=Math.max(0,Math.min(.045,(now-last)/1000));last=now;
 if(mode!=='paused'){
  worldTime+=dt;
  if(mode==='intro')attract(dt);
  else if(mode==='count')countdownStep(dt);
  else if(mode==='play'){flight(dt);chaseCam(dt)}
  shore(travel);seaU.t.value=worldTime;seaU.d.value=travel;effects(dt)
 }
 if(ac){engineGain.gain.setTargetAtTime(sound&&mode==='play'?.024:0,ac.currentTime,.08);engine.frequency.setTargetAtTime(30+speed*.70+(boost?12:0),ac.currentTime,.12)}
 renderer.render(scene,cam)
}
requestAnimationFrame(frame);
</script>
