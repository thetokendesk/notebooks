<!doctype html>
<html lang="en">
<head>

<title>Aftertide — Manta Rally</title>
<style>
:root{--ink:#102833;--paper:#fff2d8;--mint:#94ffdc;--gold:#ffbc65;--orange:#ff8350;--pink:#ffa1cd;--line:#fff0d847}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#142e39;color:var(--paper);font-family:Arial,Helvetica,sans-serif}
body{touch-action:none;user-select:none;-webkit-user-select:none}

[hidden]{display:none!important}

.mono,.micro,.brand,button,.badge{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",monospace}

.top,.bottom{display:flex;align-items:flex-start;justify-content:space-between}.bottom{position:absolute;bottom:0;width:100%;align-items:flex-end}.right{text-align:right}
.big{font-size:clamp(34px,4vw,56px);letter-spacing:-.055em;line-height:.99;font-variant-numeric:tabular-nums}

#overlay{position:absolute;z-index:6;inset:0;display:grid;place-items:center;background:#0a1b2ac2;padding:16px}
.card{width:min(435px,100%);max-height:94dvh;overflow:auto;padding:29px;background:#152e38;border-top:4px solid var(--orange);box-shadow:9px 11px #071e2966}
h2{font-size:clamp(42px,7vw,68px);font-style:italic;letter-spacing:-.06em;line-height:.95;margin:15px 0}
#summary{line-height:1.5;font-size:15px;margin:12px 0 20px}

body.touch .touchHelp{display:inline}body.touch .keyHelp{display:none}
@media(max-width:650px){#mast{gap:8px;top:max(12px,env(safe-area-inset-top))}.brand{font-size:10px}.mark{width:30px}.icon{width:38px;height:36px}
#menu{background:linear-gradient(90deg,#102735d4,#1027355c 52%,transparent)}.desc{max-width:263px}#foot{font-size:9px;letter-spacing:0}#foot .loc{display:none}
#hud{top:max(65px,calc(env(safe-area-inset-top) + 52px))}.micro{font-size:9px}#meter,#track{width:114px}#sector{font-size:10px}#route{bottom:74px;font-size:9px}#callout{top:15%}#callout small{font-size:9px}.round{width:54px;height:54px}#actions{bottom:106px}}
@media(max-height:525px){#mast{top:7px}#menu{padding:45px 7vw 25px}h1{font-size:64px;margin:9px 0}h1 span{display:inline}.badge{font-size:9px}.desc{margin:8px 0 12px}.cta{height:39px}#record{margin-top:7px}#foot{bottom:8px}#hud{top:52px;bottom:14px}#callout{top:2%}.card{padding:16px}.stats{margin-top:7px}#actions{bottom:67px}}
@media(prefers-reduced-motion:reduce){#callout.pop strong{animation:none}}
</style>

<body>
<canvas id="world" aria-label="Three-dimensional coastal air race"></canvas><div id="frame"></div>
<header id="mast"><div class="mark"></div><div class="brand">AFTERTIDE / ARCADE</div><div class="rule"></div>
<button id="pause" class="icon" hidden aria-label="Pause race" title="Pause (P)"><svg viewBox="0 0 24 24"><path d="M8 5v14m8-14v14"/></svg></button>
<button id="sound" class="icon" aria-label="Mute sound" title="Sound"><svg viewBox="0 0 24 24"><path d="M3 9h4l5-4v14l-5-4H3z"/><path id="waveIcon" d="M16 8q4 4 0 8m3-11q7 7 0 14"/></svg></button></header>
<section id="menu"><div class="poster"><div class="eyebrow mono">Salt Coast Championship</div><h1>AFTER<span>TIDE</span></h1><div class="badge">MANTA RALLY</div>
<p class="desc">One rival. Twenty-four rings. Beat Nova to the flying carrier before the sun goes down.</p>
<button class="cta" id="launch">START RACE <b>↗</b></button><div id="record" class="mono"></div></div></section>
<footer id="foot" class="mono"><span class="keyHelp"><b>WASD / ARROWS</b> FLY &nbsp;·&nbsp; <b>SHIFT</b> ROLL &nbsp;·&nbsp; <b>SPACE</b> OVERDRIVE</span><span class="touchHelp"><b>DRAG</b> TO FLY &nbsp;·&nbsp; TAP <b>ROLL</b> OR <b>PULSE</b></span><span class="loc">SALT COAST &nbsp; / &nbsp; SECTOR 07</span></footer>
<div id="hud" hidden><div class="top">
<div><div class="micro">Score</div><div id="score" class="display big">000000</div><div id="chain" class="mono"></div></div>
<div class="right"><div id="rank" class="mono"></div><div id="hull" aria-label="Hull integrity"><i></i><i></i><i></i></div><div id="gap" class="mono"></div></div></div>
<div id="callout" hidden><strong id="callTitle" class="display"></strong><small id="callSub" class="mono"></small></div>
<div class="bottom"><div><div class="micro">Overdrive</div><div id="meter"><div id="fill"></div></div><div id="energy" class="mono"></div><div id="rollInfo" class="mono"></div></div>
<div class="right"><div id="sector" class="mono"></div><div id="track"><i id="novaDot" class="dot"></i><i id="playerDot" class="dot"></i></div><div id="readout" class="mono"></div></div></div><div id="route" class="mono"></div></div>
<div id="guide" hidden><b>➤</b><span></span></div>
<div id="actions" hidden><button id="rollTouch" class="round" aria-label="Barrel roll">ROLL</button><button id="pulseTouch" class="round" aria-label="Activate overdrive">PULSE</button></div>
<div id="flash"></div>
<section id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="cardTitle"><div class="card"><div class="eyebrow mono" id="cardBrow"></div><h2 id="cardTitle"></h2><div id="summary"></div><button id="cardButton" class="cta"></button></div></section>
<script type="module">
import * as T from 'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js';

const $=id=>document.getElementById(id),canvas=$('world'),TAU=Math.PI*2;
const clamp=T.MathUtils.clamp,mix=T.MathUtils.lerp,damp=(a,b,k,dt)=>mix(a,b,1-Math.exp(-k*dt));
const hash=i=>{const n=Math.sin(i*127.1+311.7)*43758.5453;return n-Math.floor(n)};
const fmt=n=>Math.floor(n).toLocaleString('en-US');
function timer(t){const n=Math.floor(Math.max(0,t)*100+.00001);return Math.floor(n/6000)+':'+String(Math.floor(n/100)%60).padStart(2,'0')+'.'+String(n%100).padStart(2,'0')}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
let touch=matchMedia('(pointer:coarse)').matches;document.body.classList.toggle('touch',touch);
function read(k){try{return localStorage.getItem('aftertide-rally-'+k)}catch{return null}}
function save(k,v){try{localStorage.setItem('aftertide-rally-'+k,String(v))}catch{}}
function storedNumber(k){const n=Number(read(k));return Number.isFinite(n)&&n>0?n:0}
let best=storedNumber('score'),bestTime=storedNumber('time'),sound=read('sound')!=='off';
function recordText(){$('record').textContent='COURSE RECORD  /  '+fmt(best)+(bestTime?'   ·   '+timer(bestTime):'')}
recordText();

const scene=new T.Scene(),camera=new T.PerspectiveCamera(61,1,.12,625);
let renderer;
try{renderer=new T.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'})}
catch(error){$('launch').disabled=true;$('launch').textContent='WEBGL UNAVAILABLE';document.querySelector('.desc').textContent='This race needs a browser with hardware-accelerated WebGL.';throw error}
renderer.setClearColor(0xf2b494);scene.fog=new T.FogExp2(0xf4b99c,.0062);
const sun=new T.DirectionalLight(0xffdcaf,2.3);sun.position.set(-32,48,-24);
scene.add(sun,new T.HemisphereLight(0xffe8d1,0x58879a,1.9));
const surface=(color,metalness=.12,roughness=.62)=>new T.MeshStandardMaterial({color,metalness,roughness,flatShading:true,side:T.DoubleSide});
const lit=color=>new T.MeshBasicMaterial({color,side:T.DoubleSide});
const group=(parent=scene)=>{const g=new T.Group();parent.add(g);return g};
const mesh=(geo,mat,parent=scene)=>{const m=new T.Mesh(geo,mat);parent.add(m);return m};
const unitBox=new T.BoxGeometry();
function box(parent,x,y,z,w,h,d,m){const o=mesh(unitBox,m,parent);o.position.set(x,y,z);o.scale.set(w,h,d);return o}
function skin(parent,points,faces,material){
 const a=[];for(const face of faces)for(const i of face)a.push(...points[i]);
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(a,3));g.computeVertexNormals();return mesh(g,material,parent)
}
function ribbonGeometry(a,c){
 const g=new T.BufferGeometry();g.setAttribute('position',new T.Float32BufferAttribute(a,3));g.setAttribute('color',new T.Float32BufferAttribute(c,3));g.computeVertexNormals();return g
}
const sky=mesh(new T.SphereGeometry(485,40,22),new T.ShaderMaterial({
 side:T.BackSide,depthWrite:false,
 vertexShader:`varying vec3 v;void main(){v=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
 fragmentShader:`varying vec3 v;void main(){vec3 n=normalize(v);float h=max(n.y,0.);vec3 c=mix(vec3(.99,.73,.57),vec3(.97,.54,.48),smoothstep(0.,.24,h));c=mix(c,vec3(.25,.45,.62),smoothstep(.12,.69,h));float r=length(n-normalize(vec3(-.265,.136,-1.)));c+=vec3(.22,.12,.05)*exp(-r*8.);float s=1.-smoothstep(.067,.069,r);s*=mix(smoothstep(.12,.24,fract((n.y+.02)*108.)),1.,smoothstep(.099,.155,n.y));gl_FragColor=vec4(mix(c,vec3(1.,.92,.67),s),1.);}`
}));
const waterU={time:{value:0},distance:{value:0}};
const water=mesh(new T.PlaneGeometry(540,520),new T.ShaderMaterial({uniforms:waterU,
 vertexShader:`varying vec3 p;void main(){p=(modelMatrix*vec4(position,1.)).xyz;gl_Position=projectionMatrix*viewMatrix*vec4(p,1.);}`,
 fragmentShader:`varying vec3 p;uniform float time,distance;float hash(vec2 n){return fract(sin(dot(n,vec2(37.1,91.7)))*17351.31);}void main(){vec2 q=vec2(p.x,p.z-distance);float f=smoothstep(8.,214.,-p.z);float w=sin(q.x*.22+q.y*.50+time*1.4)+sin(q.y*1.21-q.x*.13+time*1.9);vec3 c=mix(vec3(.053,.335,.372),vec3(.93,.68,.54),f*.87)+w*.021*(1.-f);vec2 cell=vec2(q.x*.31+sin(q.y*1.66+time)*.43,q.y*.98+time*.54);float spark=smoothstep(.76,.97,hash(floor(cell)))*smoothstep(.19,.43,fract(cell.y))*(1.-smoothstep(.51,.76,fract(cell.y)));float path=exp(-abs(p.x-.26*p.z)*.105);c+=spark*(vec3(.13,.27,.25)+path*vec3(.92,.51,.22))*(1.-smoothstep(65.,195.,-p.z));gl_FragColor=vec4(c,1.);}`
}));
water.rotation.x=-Math.PI/2;water.position.z=-182;
function ridge(cx,width,height,z,color,seed){
 const a=[],cols=[],base=new T.Color(color),v=new T.Color();let prev;
 for(let j=0;j<=25;j++){
  const x=cx+width*(j/25-.5),h=Math.sin(Math.PI*j/25)**.76*height;
  const row=[[x,h*(.54+.46*hash(seed+j)),z-7*hash(j+seed+4)],[x-2,h*.27,z+10],[x,-1,z+17]];
  if(prev)for(const [b,c,d,k] of [[prev[0],prev[1],row[0],.98],[row[0],prev[1],row[1],.86],[prev[1],prev[2],row[1],.76],[row[1],prev[2],row[2],.82]]){
   a.push(...b,...c,...d);v.copy(base).multiplyScalar(k);for(let i=0;i<3;i++)cols.push(v.r,v.g,v.b)
  }
  prev=row
 }
 mesh(ribbonGeometry(a,cols),new T.MeshBasicMaterial({vertexColors:true,side:T.DoubleSide}))
}
ridge(0,490,45,-236,0xb68697,71);ridge(-114,207,34,-169,0xb88382,7);ridge(113,170,44,-178,0xa57980,32);

const COUNT=24,SPACING=49,FIRST=68,gateAt=i=>FIRST+i*SPACING,FINISH=gateAt(COUNT)+12;
const course=group(),sectors=['SALT INLET','NEEDLE REEF','MANTA REACH'];
const stone=['#ffe0ae','#d69a79','#bb786d','#dc9f7b','#edbd94'].map(c=>new T.Color(c));
const rockMat=new T.MeshStandardMaterial({vertexColors:true,flatShading:true,side:T.DoubleSide,roughness:.98});
function coastPoint(s,i,r){
 const k=hash(i+s*179),edge=21+3.2*Math.sin(i*.19+s)+2*Math.sin(i*.058)+k*2.8,h=3.3+7.7*hash(i*.14+s)+4.1*(1+Math.sin(i*.29+s));
 const row=[[edge,-.65],[edge+1.65,.9],[edge+4+k,h*.40],[edge+6+3*k,h],[edge+12,h+1.5],[edge+25,h*.49]][r];
 return [s*row[0],row[1],-i*6]
}
const land=[];
for(let chunk=-1;chunk<34;chunk++){
 const a=[],colors=[],c=new T.Color();
 for(const s of [-1,1])for(let j=0;j<8;j++)for(let r=0;r<5;r++){
  const i=chunk*8+j,A=coastPoint(s,i,r),B=coastPoint(s,i+1,r),C=coastPoint(s,i,r+1),D=coastPoint(s,i+1,r+1);
  for(const [k,tri] of [[0,[A,C,B]],[1,[B,C,D]]]){
   if(s===1)tri.reverse();c.copy(stone[r]).multiplyScalar(.81+.21*hash(i*8+r*3+k+s));
   for(const p of tri){a.push(...p);colors.push(c.r,c.g,c.b)}
  }
 }
 const o=mesh(ribbonGeometry(a,colors),rockMat,course);land.push([o,chunk*48])
}
const ivory=surface(0xffe3b8,.29,.43),orange=surface(0xeb593b,.35,.40),dark=surface(0x243a44,.46,.45),glass=surface(0x196a80,.62,.21),mint=lit(0x9bffe0),pink=lit(0xff91c5),berry=surface(0xb33c80,.36,.41),gold=surface(0xffaa44,.38,.39),warm=lit(0xffe7a3),shade=surface(0x64483e,.27,.56);
const diamond=[[0,1,2],[0,2,3],[0,3,4],[0,4,1],[1,5,2],[2,5,3],[3,5,4],[4,5,1]];
function craft(accent,light){
 const p=group(),flames=[];
 skin(p,[[0,.02,-2.38],[-.58,.03,.6],[0,.46,.55],[.58,.03,.6],[0,-.32,.55],[0,-.03,1.52]],diamond,ivory);
 skin(p,[[0,.23,-1.34],[-.35,.24,.28],[0,.67,.35],[.35,.24,.28],[0,.16,.26],[0,.23,.79]],diamond,glass);
 for(const s of [-1,1]){
  skin(p,[[s*.29,.06,-1],[s*2.57,-.1,1.30],[s*2.32,-.02,1.58],[s*.37,.19,1.03],[s*.85,-.19,.90]],[[0,1,3],[1,2,3],[0,4,1],[1,4,2],[2,4,3]],ivory);
  skin(p,[[s*1.16,.09,-.02],[s*1.57,.07,.34],[s*1.94,.029,1.48],[s*1.51,.08,1.35]],[[0,1,2],[0,2,3]],accent);
  skin(p,[[s*1.97,0,1.24],[s*2.52,.49,1.52],[s*2.57,.54,.94],[s*2.32,.04,.78]],[[0,1,2],[0,2,3]],accent);
  box(p,s*.59,-.035,.8,.38,.37,1.6,dark);box(p,s*.59,-.035,1.62,.27,.23,.055,light);
  const geo=new T.ConeGeometry(.18,1.22,7);geo.translate(0,.61,0);const f=mesh(geo,light,p);f.rotation.x=Math.PI/2;f.position.set(s*.59,-.035,1.65);flames.push(f)
 }
 p.userData.flames=flames;return p
}
const ship=craft(orange,mint),nova=craft(berry,pink);
function nameplate(text,color){
 const can=document.createElement('canvas');can.width=256;can.height=64;const c=can.getContext('2d');
 c.fillStyle='#122d38e8';c.fillRect(12,6,232,50);c.fillStyle=color;c.fillRect(12,6,6,50);
 c.font='bold 29px monospace';c.textAlign='center';c.textBaseline='middle';c.fillText(text,133,32);
 const tex=new T.CanvasTexture(can);tex.colorSpace=T.SRGBColorSpace;
 const o=new T.Sprite(new T.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));o.scale.set(3.2,.8,1);scene.add(o);return o
}

  const points=(clean?200:100)*(hot?3:1)*Math.min(chain,8)+(trick?350:0);score+=points;energy=clamp(energy+(clean?23:15)+(hot?10:0),0,100);
  notify(trick?'CORKSCREW!':hot?'HOT LINE!':clean?'PERFECT LINE':'RING CLEAR','+'+fmt(points)+(hot?'  /  PINK ×3':'')+(trick?'  /  ROLL STUNT':'')+(chain>1?'  /  CHAIN '+chain:''),hot?'var(--pink)':clean||trick?'var(--mint)':'#ffdc9a');
  const f=352*2**(Math.min(chain,8)/12);tone(f,.13,'triangle');tone(f*(clean?1.5:1.25),.21,'sine',.08,.075);if(hot||trick)tone(f*2,.19,'triangle',.06,.13);
  const x=hot?g.ax:g.x,y=hot?g.ay:g.y,r=hot?2.56:R;
  for(let j=0;j<26;j++){const a=Math.random()*TAU;spray(x+Math.cos(a)*r,y+Math.sin(a)*r,0,hot?0xffa4ce:0xffdd99,1,5)}
 }else{chain=0;notify('WIDE LINE','CHAIN RESET','#ffceaa',.65)}
 next++;
}
function events(previousDistance,dt){
 while(next<COUNT&&travel>=gates[next].d)gateEvent(gates[next]);
 const ns=Math.min(2,Math.floor(next/8));
 if(ns>sector){sector=ns;const repair=hp<3;hp=Math.min(3,hp+1);energy=Math.min(100,energy+25);notify(sectors[sector],repair?'CHECKPOINT  /  HULL +1  /  ENERGY +25':'CHECKPOINT  /  ENERGY +25','#ffe0ac',1.55);tone(650,.24,'triangle',.066,.1)}
 for(const o of gems){const u=o.userData;if(o.visible&&Math.abs(travel-u.d)<1.2&&Math.hypot(px-o.position.x,py-o.position.y)<1.65){u.done=true;o.visible=false;energy=Math.min(100,energy+6);score+=45;tone(850+(Math.floor(u.d)%3)*100,.11,'sine',.052);spray(o.position.x,o.position.y,0,0xa0ffdf,10,6)}}
 for(const m of mines){
  if(!m.visible)continue;const u=m.userData,z=travel-u.d,r=Math.hypot(px-m.position.x,py-m.position.y);
  if(Math.abs(z)<1.55&&r<1.97){
   u.done=true;m.visible=false;
   if(boost>0||roll>0){const pts=boost?500:350;score+=pts;breaks++;if(!boost)energy=Math.min(100,energy+12);spray(m.position.x,m.position.y,z,0xffa075,46,14);
    notify(boost?'MINE BREAK':'SPIN BREAK','+'+pts+(boost?'':'  /  ENERGY +12'));tone(118,.21,'sawtooth',.073,0,34);shake=.21
   }else if(invul<=0){hp--;chain=0;speed=Math.max(18,speed-14);invul=1.55;flash=.54;shake=.65;spray(px,py,.4,0xff8b6c,43,13);tone(106,.31,'sawtooth',.075,0,34);
    if(!hp){finish(false);return}notify('HULL HIT',hp+' HULL REMAINING','#ffa087')
   }
  }else if(z>1.6){u.done=true;if(r<3.8){score+=85;energy=Math.min(100,energy+9);notify('CLOSE SHAVE','+85  /  ENERGY +9','#ffdc9e',.77);tone(710,.1,'sine',.046,0,1010)}}
 }
 if(previousDistance<dockAt&&travel>=dockAt){
  if(Math.hypot(px-dockPosition.x,py-dockPosition.y)<DOCK_R-.05){
   const frac=clamp((dockAt-previousDistance)/(travel-previousDistance),0,1);raceTime-=dt*(1-frac);travel=dockAt;finish(true)
  }else{dockAt+=86;chain=0;notify('GO AROUND','FOLLOW THE CARRIER  /  AIM FOR MINT','#ffd1ac',1.45);tone(169,.24,'triangle',.05,0,99)}
 }
}
function shipPose(){
 const u=clamp(1-roll/.7,0,1),spin=roll>0?-rollDir*TAU*u*u*(3-2*u):0;
 ship.position.set(px,py+Math.sin(time*8)*.035,0);ship.rotation.set(vy*.013,-vx*.008,-vx*.027+spin);ship.visible=invul<=0||Math.sin(time*27)>-.49
}
function flight(dt){
 const prev=travel,prevTime=raceTime;raceTime+=dt;music(dt);
 roll=Math.max(0,roll-dt);rollCool=Math.max(0,rollCool-dt);boost=Math.max(0,boost-dt);invul=Math.max(0,invul-dt);energy=Math.min(100,energy+dt*1.8);
 speed=damp(speed,32+Math.min(8.5,travel*.007)+(boost?23:0),2.8,dt);travel+=speed*dt;score+=speed*dt*.18;
 if(novaTime===Infinity){const v=35.6+Math.min(8,novaD*.0068)+Math.sin(raceTime*.68)*2.2,old=novaD;novaD+=v*dt;if(novaD>=FINISH){novaTime=prevTime+(FINISH-old)/v;novaD=FINISH}}
 const horizontal=Number(keys.has('ArrowRight')||keys.has('KeyD'))-Number(keys.has('ArrowLeft')||keys.has('KeyA'));
 const vertical=Number(keys.has('ArrowUp')||keys.has('KeyW'))-Number(keys.has('ArrowDown')||keys.has('KeyS'));
 vx=damp(vx,dragMode?clamp((tx-px)*10,-25,25):horizontal*19.6,10,dt);vy=damp(vy,dragMode?clamp((ty-py)*10,-18,18):vertical*14,11,dt);
 px=clamp(px+vx*dt,-16,16);py=clamp(py+vy*dt,1.25,13.2);if(Math.abs(vx)>2)lastSide=Math.sign(vx);
 carrierAt=Math.min(dockAt,carrierAt+100*dt);shipPose();objects();events(prev,dt);if(mode!=='play')return;
 emit+=dt*(boost?90:roll?68:26);while(emit>=1){emit--;const s=Math.random()<.5?-1:1,a=ship.rotation.z;spray(px+s*.6*Math.cos(a),py+s*.6*Math.sin(a),2.12,boost||roll?0x94ffda:0xd2efdc,1,1.65)}
 uiClock-=dt;if(uiClock<=0){uiClock=.075;hud()}
}
function chase(dt){
 camX=damp(camX,px*.80,5.4,dt);camY=damp(camY,py+2.69,5.2,dt);
 const jitter=reduced?0:shake;camera.position.set(camX+(Math.random()-.5)*jitter*.4,camY+(Math.random()-.5)*jitter*.19,innerWidth<innerHeight?13.5:10.85);
 camera.lookAt(px*.80,py-.42,-16);const f=damp(camera.fov,boost&&!reduced?70:61,4.3,dt);if(Math.abs(f-camera.fov)>.001){camera.fov=f;camera.updateProjectionMatrix()}
}
function guide(){
 if(mode!=='play'){$('guide').hidden=true;return}
 const g=gates[next];if(g){
  const alt=g.alt&&Math.hypot(px-g.ax,py-g.ay)<Math.hypot(px-g.x,py-g.y);
  guideVector.set(alt?g.ax:g.x,alt?g.ay:g.y,travel-g.d)
 }else guideVector.copy(dockPosition);
 camera.updateMatrixWorld();guideVector.project(camera);
 const x=guideVector.x,y=guideVector.y;if(Math.abs(x)<.88&&y<.76&&y>-.70){$('guide').hidden=true;return}
 const e=$('guide');e.hidden=false;e.style.left=clamp(50+x*50,8,92)+'%';e.style.top=clamp(50-y*50,29,70)+'%';
 e.firstElementChild.style.transform=`rotate(${Math.atan2(-y,x)}rad)`;e.lastElementChild.textContent=g?'RING':'DOCK'
}
function startLights(dt){
 countdown-=dt;const n=Math.max(1,Math.ceil(countdown/.8));
 if(n!==countValue&&countdown>0){countValue=n;notify(String(n),'MANTA RALLY  /  START LINE','#ffe4b2',1);tone(254,.095,'square',.024)}
 ship.position.set(0,5+Math.sin(time*5)*.05,0);objects();chase(dt);
 if(countdown<=0){mode='play';controls();notify('GO!','GOLD RINGS CHARGE OVERDRIVE','var(--mint)',1.25);tone(670,.25,'triangle',.087)}
}
function attract(dt){
 travel=58+46*Math.sin(time*.085);px=3.4+Math.sin(time*.47)*.63;py=4.7+Math.sin(time*.74)*.14;
 ship.position.set(px,py,0);ship.rotation.set(.034,-.23+Math.sin(time*.40)*.078,.12+Math.sin(time*.68)*.095);
 const portrait=innerWidth<innerHeight;camera.position.set(portrait?px+3.75:8.25,py+2.55,portrait?12.3:8.3);camera.lookAt(portrait?px-.93:-.05,py+.91,-3.5);objects(true)
}
function outro(dt){
 celebration-=dt;
 if(finishDock){ship.position.x=damp(ship.position.x,dockPosition.x,4,dt);ship.position.y=damp(ship.position.y,dockPosition.y+.44,3,dt);ship.position.z-=dt*3.7;ship.rotation.z=damp(ship.rotation.z,0,5,dt)}
 if(celebration<=0)results()
}
function effects(dt){
 waveTime=Math.max(0,waveTime-dt);wave.visible=waveTime>0&&!reduced;
 if(wave.visible){const u=1-waveTime/.48;wave.position.set(px,py,1.5+u*3.8);wave.scale.setScalar(.6+u*8.8);wave.material.opacity=1-u}
 wind.visible=boost>0&&mode==='play'&&!reduced;
 if(wind.visible){for(let i=0;i<lineCount;i++){
  const a=i*2.39996,r=5.2+hash(i+3)*13,z=12-(((hash(i)*100-time*67)%100+100)%100),k=i*6;
  lines[k]=lines[k+3]=px+Math.cos(a)*r;lines[k+1]=lines[k+4]=py+Math.sin(a)*r;lines[k+2]=z;lines[k+5]=z-2.6-hash(i+4)*3.45
 }lineGeo.attributes.position.needsUpdate=true}
 for(const f of ship.userData.flames)f.scale.y=(boost?2.85:1)*(.91+Math.sin(time*44)*.12);
 for(const f of nova.userData.flames)f.scale.y=1.21+Math.sin(time*39)*.12;
 shadow.position.set(ship.position.x,.044,ship.position.z);shadow.scale.set(2.05+py*.04,1.55+py*.053,1);shadow.material.opacity=Math.max(.07,.31-py*.017);
 flash=Math.max(0,flash-dt*1.9);shake=Math.max(0,shake-dt*1.85);$('flash').style.opacity=reduced?flash*.35:flash;
 if(msgTime>0){msgTime-=dt;if(msgTime<=0)$('callout').hidden=true}
 particleStep(dt,mode==='play'?speed:0);waterU.time.value=time;waterU.distance.value=travel
}
function resize(){renderer.setPixelRatio(Math.min(devicePixelRatio||1,touch?1.5:1.75));renderer.setSize(innerWidth,innerHeight,false);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
resize();window.addEventListener('resize',resize);
let last=performance.now();
function frame(now){
 requestAnimationFrame(frame);let remaining=clamp((now-last)/1000,0,.12);last=now;
 if(mode!=='paused'&&mode!=='results'){
  const frameDt=remaining;
  while(remaining>.000001){
   const dt=Math.min(remaining,1/60);remaining-=dt;time+=dt;
   if(mode==='intro')attract(dt);else if(mode==='count')startLights(dt);else if(mode==='play')flight(dt);else if(mode==='outro')outro(dt);
   effects(dt);if(mode==='results')break
  }
  if(mode==='play'){chase(frameDt);guide()}
 }
 if(engineGain){engineGain.gain.setTargetAtTime(mode==='play'?.024:0,ac.currentTime,.075);engine.frequency.setTargetAtTime(30+speed*.69+(boost?12:0),ac.currentTime,.13)}
 renderer.render(scene,camera)
}
requestAnimationFrame(frame);
</script>
