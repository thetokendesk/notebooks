 c.onpointerdown=e=>{if(!ready||e.button||pointer!==null)return;e.preventDefault();pointer=e.pointerId;c.setPointerCapture(pointer);snapshot();const [x,y]=xy(e);g.fillStyle=g.strokeStyle=color;g.lineWidth=Number(size.value);g.lineJoin=g.lineCap="round";g.beginPath();g.arc(x,y,g.lineWidth/2,0,2*Math.PI);g.fill();g.beginPath();g.moveTo(x,y)};
 c.onpointermove=e=>{if(pointer!==e.pointerId)return;const pos=xy(e);g.lineTo(...pos);g.stroke();g.beginPath();g.moveTo(...pos)};
 function finish(){if(pointer!==null){pointer=null;persist()}}c.onlostpointercapture=finish;w.cleanup=finish;
}
function calcApp(w){
 const p=w.body;p.innerHTML=`<div class="calc"><div class="display"><div class="expr"></div><output class="answer">0</output></div><div class="keys"></div></div>`;
 const ops=["+","−","×","÷"],keys=["AC","±","%","÷","7","8","9","×","4","5","6","−","1","2","3","+","⌫","0",".","="];
 let val="0",acc=0,op="",again="",operand=0,replace=true,waiting=false,expr="";
 const format=n=>Number.isFinite(n)?String(Number(n.toPrecision(12))):"Error";
 const apply=(a,b,o)=>o==="+"?a+b:o==="−"?a-b:o==="×"?a*b:a/b;
 function reset(){val="0";acc=operand=0;op=again=expr="";replace=true;waiting=false}
 function press(k){
 if(val==="Error"||k==="AC")reset();
 if(/^\d$/.test(k)||k==="."){if(replace){val=k==="."?"0.":k;replace=false;if(!op){again=expr=""}}else if(k==="."?!val.includes("."):val.length<15)val=val==="0"&&k!=="."?k:val+k;waiting=false}
 else if(k==="±"||k==="%"){val=format(k==="±"?-Number(val):Number(val)/100);replace=waiting=false;if(!op)again=expr=""}
 else if(k==="⌫"&&!replace){val=val.slice(0,-1);if(!val||val==="-")val="0"}
 else if(ops.includes(k)){if(op&&!waiting)val=format(apply(acc,Number(val),op));acc=Number(val);op=k;again="";expr=val+" "+k;replace=waiting=true}
 else if(k==="="&&(op||again)){const a=op?acc:Number(val),b=op?Number(val):operand,o=op||again;val=format(apply(a,b,o));expr=a+" "+o+" "+b+" =";again=o;operand=b;op="";replace=true;waiting=false}
 $(".expr",p).textContent=expr;$(".answer",p).textContent=val}
 for(const k of keys){const b=document.createElement("button");b.className="raised"+(ops.includes(k)?" op":k==="="?" equal":"");b.textContent=k;b.onclick=()=>{press(k);w.el.focus()};$(".keys",p).append(b)}
 w.el.onkeydown=e=>{if(e.metaKey||e.ctrlKey||e.altKey||e.target.closest(".wbuttons"))return;const k=({"*":"×","/":"÷","-":"−",Enter:"=",Escape:"AC",Backspace:"⌫",Delete:"AC"})[e.key]||e.key;if(keys.includes(k)){e.preventDefault();press(k)}};
}
function radioApp(w){
 const p=w.body,stations=[{name:"Pine Ridge",freq:"88.5",kind:"Wind through the pines"},{name:"Rain Station",freq:"96.7",kind:"Rain on a cabin roof"},{name:"Outer Coast",freq:"104.9",kind:"Surf at the shoreline"}];
 let index=clamp(Number(read("station",0))||0,0,2),audio=null,master=null,band=null,low=null,pulse=null,depth=null,texture=null,closed=false,busy=false;
 p.innerHTML=`<div class="radio"><div class="radiohead"><strong>Field receiver</strong><span class="smallcap"><i class="led"></i><span class="powerstate">Off</span></span></div><div class="dialcase"><div class="station"><output></output><span class="frequency"></span></div><div class="dial"><i></i></div><div class="dialnums"><span>88</span><span>92</span><span>96</span><span>100</span><span>104</span><span>108</span></div></div><div class="tuninglabel"><label class="smallcap" for="tuner">Tuning</label><span class="soundname"></span></div><input id="tuner" type="range" min="0" max="2" step="1"><div class="radioctl"><button class="raised power"></button><label>Vol <input class="volume" aria-label="Radio volume" type="range" min="0" max="100"></label><span class="speaker" aria-hidden="true"></span></div></div><div class="foot"><span>Field Radio FM</span><span>Stereo receiver</span></div>`;
 const tune=$("#tuner",p),volume=$(".volume",p),power=$(".power",p);tune.value=index;volume.value=clamp(Number(read("volume",35)),0,100);
 function update(){
 const s=stations[index];$("output",p).textContent=s.name;$(".frequency",p).textContent=s.freq+" MHz";$(".soundname",p).textContent=s.kind;$(".dial i",p).style.left=(Number(s.freq)-88)*5+"%";tune.setAttribute("aria-valuetext",s.name+" "+s.freq+" MHz");
 power.textContent=audio?"Power off":"Power on";power.setAttribute("aria-pressed",String(Boolean(audio)));$(".powerstate",p).textContent=audio?"On air":"Off";$(".led",p).classList.toggle("lit",Boolean(audio));
 if(!audio||!master)return;
 const t=audio.currentTime,settings=[[710,1250,.105,.11,.05],[2300,5900,3.1,.025,.12],[440,1100,.12,.20,.07]][index];
 band.frequency.setTargetAtTime(settings[0],t,.2);low.frequency.setTargetAtTime(settings[1],t,.2);pulse.frequency.setTargetAtTime(settings[2],t,.2);depth.gain.setTargetAtTime(settings[3],t,.2);texture.gain.setTargetAtTime(settings[4],t,.2);master.gain.setTargetAtTime(Number(volume.value)/100*.85,t,.09);
 }
 function off(){const a=audio;audio=master=null;if(a&&a.state!=="closed")a.close().catch(()=>{});update()}
 async function on(){
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC){toast("Audio is unavailable in this browser.");return}
 try{
 audio=new AC();const a=audio;await a.resume();if(closed||audio!==a)return;
 const frames=Math.floor(a.sampleRate*4),buffer=a.createBuffer(2,frames,a.sampleRate);
 for(let ch=0;ch<2;ch++){const data=buffer.getChannelData(ch);let prev=0;for(let i=0;i<frames;i++){const white=Math.random()*2-1;prev=.97*prev+.19*white;data[i]=.55*white+.45*prev}}
 const noise=a.createBufferSource();noise.buffer=buffer;noise.loop=true;
 master=a.createGain();master.gain.value=0;master.connect(a.destination);
 band=a.createBiquadFilter();band.type="bandpass";band.Q.value=.75;
 low=a.createBiquadFilter();low.type="lowpass";low.Q.value=.45;
 const swell=a.createGain();swell.gain.value=.28;texture=a.createGain();texture.gain.value=.05;
 pulse=a.createOscillator();depth=a.createGain();depth.gain.value=0;pulse.connect(depth).connect(swell.gain);
 noise.connect(band).connect(swell).connect(master);noise.connect(low).connect(texture).connect(master);
 update();noise.start();pulse.start();
 }catch{off();if(!closed)toast("The receiver could not start audio.")}
 }
 power.onclick=async()=>{if(busy)return;busy=true;try{if(audio)off();else await on()}finally{busy=false}};
 tune.oninput=()=>{index=Number(tune.value);write("station",index);update()};volume.oninput=()=>{write("volume",Number(volume.value));update()};w.cleanup=()=>{closed=true;off()};update();
}
const previous=read("session",null);
if(Array.isArray(previous)){for(const s of previous){if(!s||!Object.hasOwn(apps,s.app))continue;if(s.app==="notes"||s.app==="paint"){const n=node(s.file);if(!n||trashed(n)||n.type!==(s.app==="notes"?"text":"image"))continue}openApp(s.app,s.file,s)}}else openApp("files");
restoring=false;
})();
